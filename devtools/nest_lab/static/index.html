<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElfieNest · Nest Lab</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="lab-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">DEVELOPER TOOL · ISOLATED</p>
          <h1>Nest Lab</h1>
          <p class="subtitle">固定房间中的角色、碰撞与 Nest / Godot 协作实验台</p>
        </div>
        <div class="connection" aria-live="polite">
          <span id="connectionDot" class="dot"></span>
          <span id="connectionText">正在连接 Godot Runtime…</span>
        </div>
      </header>

      <section class="layout" aria-label="Nest Lab 工作区">
        <section class="preview-panel panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">LIVE ROOM</p>
              <h2>房间预览</h2>
            </div>
            <span id="roomStatus" class="status-pill">等待运行时</span>
          </div>
          <div id="roomPreview" class="room-preview">
            <iframe id="godotFrame" title="Nest Lab Godot 房间预览" hidden></iframe>
            <div id="previewPlaceholder" class="preview-placeholder">
              <strong>Godot Web 运行时尚未就绪</strong>
              <p id="previewHint">正在检查本地导出物…</p>
            </div>
          </div>
          <p class="preview-note">房屋几何、渲染、路径和碰撞均由 Godot 执行；本页只发出语义指令并展示事实事件。</p>
        </section>

        <aside class="control-column">
          <section class="panel controls-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">WORLD</p>
                <h2>房间设置</h2>
              </div>
            </div>
            <label for="bedCount">床位数 <output id="bedCountValue">4</output></label>
            <div class="range-row">
              <input id="bedCount" type="range" min="1" max="32" value="4" />
              <button id="applyBeds" type="button">应用</button>
            </div>
            <p id="worldSummary" class="muted">0 个临时角色 · 世界版本 1</p>
          </section>

          <section class="panel controls-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">ACTORS</p>
                <h2>添加角色</h2>
              </div>
            </div>
            <div class="button-grid">
              <button id="addFox" class="species fox" type="button">添加狐狸</button>
              <button id="addDog" class="species dog" type="button">添加小狗</button>
            </div>
            <ul id="actorList" class="actor-list" aria-label="当前角色"></ul>
          </section>

          <section class="panel controls-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">SIMULATION</p>
                <h2>实验控制</h2>
              </div>
            </div>
            <div class="button-grid simulation-grid">
              <button id="wanderToggle" type="button">随机游走</button>
              <button id="pauseSimulation" type="button">暂停</button>
              <button id="resumeSimulation" type="button">继续</button>
              <button id="resetSimulation" class="danger" type="button">重置</button>
            </div>
          </section>
        </aside>

        <section class="events-panel panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">EVENTS</p>
              <h2>事件时间线</h2>
            </div>
            <button id="refreshEvents" class="quiet" type="button">刷新</button>
          </div>
          <ol id="eventTimeline" class="event-timeline" aria-live="polite"></ol>
        </section>
      </section>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
