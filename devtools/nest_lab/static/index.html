<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElfieNest Nest Lab</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #eef3ef; color: #20342b; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
    section { background: #fff; border: 1px solid #cbd8cf; border-radius: 8px; padding: 24px; }
    h1 { margin-top: 0; }
    code { color: #35654b; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>精灵巢模块实验台</h1>
      <p>这里用于单独验证房间、碰撞、运动和 Godot 通信模块，不连接正式用户服务。</p>
      <p id="status">正在读取模块状态…</p>
    </section>
  </main>
  <script>
    fetch('/api/world').then((response) => response.json()).then((world) => {
      document.getElementById('status').textContent = `隔离运行 · 最多 ${world.max_elfies} 只精灵 · ${world.runtime}`;
    });
  </script>
</body>
</html>
