repos:
  - repo: local
    hooks:
      - id: quality-baseline
        name: Python quality baseline
        entry: uv run --no-sync python scripts/check_quality_baseline.py
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
