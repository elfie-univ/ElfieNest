name: 功能建议
description: 提议与当前产品和架构边界一致的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述用户问题，不要把未公开设计稿、合作材料或私有世界观直接贴到 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到了什么问题？为什么当前行为不足？
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前实现状态
      description: 指向已经存在的代码、命令、测试或公开文档；明确哪些能力尚未实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述可观察行为和最小范围，不必先规定内部实现。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要边界
      options:
        - elfie - 单个精灵
        - nest - 活动空间
        - app - 产品与编排
        - ai_runtime - AI 运行时
        - desktop - Electron 宿主
        - godot - 场景与渲染
        - devtools - 隔离开发工具
        - docs - 公开文档
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验收结果
      description: 列出用户能观察、测试或重放的完成标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和公开文档。
          required: true
        - label: 我已区分当前能力、规划能力和故事设定。
          required: true
        - label: 内容不含密钥、用户数据或私有材料。
          required: true
