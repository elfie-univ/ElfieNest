name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.9.26"

jobs:
  architecture-governance:
    name: Architecture Governance
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install pinned environment
        run: |
          uv python install 3.9.25
          uv sync --locked --extra dev

      - name: Check candidate scanner against candidate baseline
        run: |
          if test -f test/architecture/baselines/app_layer.py; then
            uv run --no-sync python scripts/architecture/app_layer_scan.py \
              --project-root . \
              --baseline test/architecture/baselines/app_layer.py \
              --mode exact
          else
            uv run --no-sync python scripts/architecture/app_layer_scan.py \
              --project-root . \
              --mode deny-all
          fi

      - name: Check candidate system scanner against candidate baseline
        run: |
          if test -f test/architecture/baselines/system_layer.py; then
            uv run --no-sync python scripts/architecture/system_layer_scan.py \
              --project-root . \
              --baseline test/architecture/baselines/system_layer.py \
              --mode exact
          else
            uv run --no-sync python scripts/architecture/system_layer_scan.py \
              --project-root . \
              --mode deny-all
          fi

      - name: Check candidate effective dependencies
        run: |
          uv run --no-sync python scripts/architecture/effective_dependency_scan.py \
            --project-root .

      - name: Check candidate structural cleanup scopes
        run: |
          uv run --no-sync python scripts/architecture/structural_scope_scan.py \
            --project-root .

      - name: Check database boundaries and print consumer inventory
        run: |
          uv run --no-sync python scripts/architecture/database_change_scan.py \
            --project-root . \
            --base-sha "$BASE_SHA" \
            --check

      - name: Reject governance and implementation files in one change
        run: |
          if git cat-file -e "$BASE_SHA:scripts/architecture/check_governance_change.py"; then
            classifier_root="$RUNNER_TEMP/base-governance"
            classifier_dir="$classifier_root/scripts/architecture"
            mkdir -p "$classifier_dir"
            classifier="$classifier_dir/check_governance_change.py"
            git show "$BASE_SHA:scripts/architecture/check_governance_change.py" > "$classifier"
            if git cat-file -e "$BASE_SHA:scripts/architecture/structural_scope_scan.py"; then
              git show "$BASE_SHA:scripts/architecture/structural_scope_scan.py" \
                > "$classifier_dir/structural_scope_scan.py"
            fi
          else
            classifier="scripts/architecture/check_governance_change.py"
            classifier_root="$GITHUB_WORKSPACE"
          fi
          PYTHONPATH="$classifier_root" \
            uv run --no-sync python "$classifier" --base-sha "$BASE_SHA"

      - name: Apply immutable base-branch architecture ratchet
        run: |
          if git cat-file -e "$BASE_SHA:scripts/architecture/app_layer_scan.py"; then
            ratchet_dir="$RUNNER_TEMP/architecture-ratchet"
            mkdir -p "$ratchet_dir"
            git show "$BASE_SHA:scripts/architecture/app_layer_scan.py" > "$ratchet_dir/app_layer_scan.py"
            if git cat-file -e "$BASE_SHA:test/architecture/baselines/app_layer.py"; then
              git show "$BASE_SHA:test/architecture/baselines/app_layer.py" > "$ratchet_dir/app_layer.py"
              uv run --no-sync python "$ratchet_dir/app_layer_scan.py" \
                --project-root "$GITHUB_WORKSPACE" \
                --baseline "$ratchet_dir/app_layer.py" \
                --mode subset
            else
              uv run --no-sync python "$ratchet_dir/app_layer_scan.py" \
                --project-root "$GITHUB_WORKSPACE" \
                --mode deny-all
            fi
          elif git cat-file -e "$BASE_SHA:docs/developer/contracts/repository-governance.md"; then
            echo "Base branch has the governance contract but no App scanner." >&2
            exit 1
          else
            echo "Bootstrap governance change: no base-branch scanner exists yet."
          fi

      - name: Apply immutable base-branch system architecture ratchet
        run: |
          if git cat-file -e "$BASE_SHA:scripts/architecture/system_layer_scan.py"; then
            ratchet_dir="$RUNNER_TEMP/system-architecture-ratchet"
            mkdir -p "$ratchet_dir"
            git show "$BASE_SHA:scripts/architecture/system_layer_scan.py" > "$ratchet_dir/system_layer_scan.py"
            if git cat-file -e "$BASE_SHA:test/architecture/baselines/system_layer.py"; then
              git show "$BASE_SHA:test/architecture/baselines/system_layer.py" > "$ratchet_dir/system_layer.py"
              uv run --no-sync python "$ratchet_dir/system_layer_scan.py" \
                --project-root "$GITHUB_WORKSPACE" \
                --baseline "$ratchet_dir/system_layer.py" \
                --mode subset
            else
              uv run --no-sync python "$ratchet_dir/system_layer_scan.py" \
                --project-root "$GITHUB_WORKSPACE" \
                --mode deny-all
            fi
          elif git cat-file -e "$BASE_SHA:docs/developer/contracts/system.md"; then
            echo "Base branch has the system contract but no system scanner." >&2
            exit 1
          else
            echo "Bootstrap system governance change: no base-branch scanner exists yet."
          fi

      - name: Apply immutable base-branch effective dependency gate
        run: |
          if git cat-file -e "$BASE_SHA:scripts/architecture/effective_dependency_scan.py"; then
            scanner_root="$RUNNER_TEMP/effective-dependency-ratchet"
            scanner_dir="$scanner_root/scripts/architecture"
            mkdir -p "$scanner_dir"
            for file in effective_dependency_python.py effective_dependency_scan.py effective_dependency_targets.py effective_dependency_text.py; do
              git show "$BASE_SHA:scripts/architecture/$file" > "$scanner_dir/$file"
            done
            uv run --no-sync python "$scanner_dir/effective_dependency_scan.py" \
              --project-root "$GITHUB_WORKSPACE"
          elif git cat-file -e "$BASE_SHA:docs/developer/decisions/0012-effective-dependency-targets.md"; then
            echo "Base branch has ADR-0012 but no effective dependency scanner." >&2
            exit 1
          else
            echo "Bootstrap effective dependency governance: no base scanner exists yet."
          fi

  environment-smoke:
    name: Environment Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install pinned development environment
        run: |
          uv python install 3.9.25
          uv sync --locked --extra dev

      - name: Verify exact CPython runtime
        run: >
          .venv/bin/python3 -c 'import platform, sys;
          raise SystemExit(0 if sys.implementation.name == "cpython" and
          platform.python_version() == "3.9.25" else 1)'

      - name: Run CLI version smoke test
        run: .venv/bin/python3 scripts/elfienest.py version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install pinned environment
        run: |
          uv python install 3.9.25
          uv sync --locked --extra dev

      - name: Check dependency lock
        run: uv lock --check

      - name: Check Node toolchain manifests
        run: bash scripts/check_node_toolchain.sh

      - name: Check Python quality baseline
        run: uv run --no-sync python scripts/check_quality_baseline.py

      - name: Run pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install pinned environment
        run: |
          uv python install 3.9.25
          uv sync --locked --extra dev

      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: devtools/web/pnpm-lock.yaml

      - name: Install Developer Tools frontend dependencies
        working-directory: devtools/web
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: uv run --no-sync pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build
