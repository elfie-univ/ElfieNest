name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub Release after all native packages pass validation
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing or new tag to publish (must equal v<pyproject version>)
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.9.26"
  PNPM_VERSION: "10.12.1"
  PYTHONUTF8: "1"

jobs:
  preflight:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      version: ${{ steps.identity.outputs.version }}
      publish_requested: ${{ steps.identity.outputs.publish_requested }}

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up metadata Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bind version, tag, and source commit before native builds
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())['project']['version'])
          PY
          )"
          expected_tag="v${version}"
          publish_requested=false
          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish_requested=true
            release_tag="$GITHUB_REF_NAME"
          elif [[ "${{ inputs.publish_release }}" == "true" ]]; then
            publish_requested=true
            release_tag="${{ inputs.release_tag }}"
          fi

          if [[ "$publish_requested" == "true" ]]; then
            [[ "$release_tag" == "$expected_tag" ]] || {
              echo "Release tag $release_tag does not match $expected_tag" >&2
              exit 1
            }
            git show-ref --verify --quiet "refs/tags/$release_tag" || {
              echo "Release tag must already exist: $release_tag" >&2
              exit 1
            }
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            [[ "$tag_commit" == "$GITHUB_SHA" ]] || {
              echo "Release tag $release_tag points to $tag_commit, build source is $GITHUB_SHA" >&2
              exit 1
            }
          fi

          printf 'release_tag=%s\nversion=%s\npublish_requested=%s\n' \
            "$release_tag" "$version" "$publish_requested" >> "$GITHUB_OUTPUT"

  godot-web:
    name: Build shared Godot runtimes
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked Godot build environment
        run: |
          set -euo pipefail
          uv python install 3.9.25
          uv sync --locked --no-dev --extra release

      - name: Install the pinned Godot Web toolchain and export once
        run: |
          set -euo pipefail
          export PROJECT_ROOT="$GITHUB_WORKSPACE"
          export ELFIE_DEV_HOME="$RUNNER_TEMP/elfienest-dev"
          RED=$'\e[1;31m'
          GREEN=$'\e[1;32m'
          YELLOW=$'\e[1;33m'
          CYAN=$'\e[1;36m'
          RESET=$'\e[0m'
          # shellcheck source=scripts/internal/bootstrap/runtime_dependencies.sh
          source scripts/internal/bootstrap/runtime_dependencies.sh
          install_official_godot_toolchain
          [[ -f "$(dirname "$GODOT_RESOLVED_EDITOR_DATA")/_sc_" ]]
          web_template="$(find "$GODOT_RESOLVED_EDITOR_DATA/export_templates" -mindepth 2 -maxdepth 2 -type f -name web_release.zip -print -quit)"
          [[ -n "$web_template" && -s "$web_template" ]]
          printf 'Godot editor data: %s\nWeb release template: %s\n' \
            "$GODOT_RESOLVED_EDITOR_DATA" "$web_template"
          GODOT_BIN="$GODOT_RESOLVED_BIN" \
            .venv/bin/python scripts/internal/build/build_godot_web.py
          .venv/bin/python scripts/internal/build/build_godot_web.py --check
          GODOT_BIN="$GODOT_RESOLVED_BIN" \
            .venv/bin/python scripts/internal/build/build_godot_dedicated.py
          .venv/bin/python scripts/internal/build/build_godot_dedicated.py --check
          tar -C build/components -czf build/godot-linux-dedicated.tar.gz \
            godot-linux-dedicated

      - name: Upload shared Godot Web Runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-web-runtime
          path: build/components/godot-web
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared Linux Dedicated Runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-linux-dedicated-runtime
          path: build/godot-linux-dedicated.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, godot-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the validation matrix pinned. Product support claims are
          # limited to these image families plus named manual hosts; never use
          # a floating -latest label for a release gate.
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install locked release environment
        run: |
          set -euo pipefail
          uv python install 3.9.25
          uv sync --locked --no-dev --extra release

      - name: Download shared Godot Web Runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: godot-web-runtime
          path: build/components/godot-web

      - name: Download shared Linux Dedicated Runtime
        if: matrix.target == 'linux-x64'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: godot-linux-dedicated-runtime
          path: build/prebuilt-godot-linux-dedicated

      - name: Restore Linux Dedicated executable permissions
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          tar -C build/components -xzf \
            build/prebuilt-godot-linux-dedicated/godot-linux-dedicated.tar.gz
          test -x build/components/godot-linux-dedicated/ElfieNestRuntime

      - name: Build and smoke-test target installer
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            export ARTIFACT_PATH_FILE="$(cygpath --windows "$RUNNER_TEMP/elfienest-artifact-path")"
            smoke_home_arg="$(cygpath --windows "$RUNNER_TEMP/elfienest-smoke-home")"
            python_bin=".venv/Scripts/python.exe"
          else
            export ARTIFACT_PATH_FILE="$RUNNER_TEMP/elfienest-artifact-path"
            smoke_home_arg="$RUNNER_TEMP/elfienest-smoke-home"
            python_bin=".venv/bin/python"
          fi
          "$python_bin" scripts/internal/build/build_godot_web.py --check

          release_command=("$python_bin" scripts/release.py \
              --target "$RELEASE_TARGET" \
              --prebuilt-godot-web \
              --native-package-output "$ARTIFACT_PATH_FILE" \
              --run-install-smoke \
              --run-product-journey \
              --run-recovery-matrix \
              --run-viewer-check \
              --smoke-cycles 3 \
              --smoke-home "$smoke_home_arg" \
              --smoke-evidence-output "dist/ElfieNest-${RELEASE_TARGET}-install-smoke.json")
          if [[ "$RELEASE_TARGET" == "linux-x64" ]]; then
            command -v xvfb-run >/dev/null
            release_command=(xvfb-run --auto-servernum "${release_command[@]}")
          fi

          set +e
          "${release_command[@]}"
          status=$?
          set -e
          [[ "$status" == "0" ]]
          [[ -s "$RUNNER_TEMP/elfienest-artifact-path" ]]
          [[ -s "dist/ElfieNest-${RELEASE_TARGET}-install-smoke.json" ]]
          artifact="$(cat "$RUNNER_TEMP/elfienest-artifact-path")"
          if command -v cygpath >/dev/null 2>&1; then
            artifact_for_shell="$(cygpath --unix "$artifact")"
          else
            artifact_for_shell="$artifact"
          fi
          [[ -f "$artifact_for_shell" ]]
          printf 'Built %s: %s\n' "$RELEASE_TARGET" "$artifact"

      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/elfienest-smoke-home/failure-diagnostics.json
            dist/ElfieNest-${{ matrix.target }}-install-smoke.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate macOS PKG contents
        if: runner.os == 'macOS'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="$(cat "$RUNNER_TEMP/elfienest-artifact-path")"
          pkgutil --check-signature "$artifact" >/dev/null 2>&1 || true
          payload_files="$(pkgutil --payload-files "$artifact")"
          grep -q './ElfieNest.app/Contents/MacOS/ElfieNest' <<< "$payload_files"
          grep -q './ElfieNest.app/Contents/Resources/management-cli/ElfieNestCli' <<< "$payload_files"
          grep -q './ElfieNest.app/Contents/Resources/manifest.json' <<< "$payload_files"

      - name: Validate Windows installer contents
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $artifact = (Get-Content "$env:RUNNER_TEMP/elfienest-artifact-path" -Raw).Trim()
          if (-not (Test-Path -LiteralPath $artifact)) { throw "Installer not found: $artifact" }
          $installRoot = Join-Path $env:RUNNER_TEMP "elfienest-installed"
          Start-Process -FilePath $artifact -ArgumentList "/S", "/D=$installRoot" -Wait -NoNewWindow
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot "ElfieNest.exe"))) { throw "Electron executable missing" }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot "resources/management-cli/ElfieNestCli.exe"))) { throw "Management CLI missing" }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot "resources/manifest.json"))) { throw "Release manifest missing" }

      - name: Validate Linux DEB contents
        if: runner.os == 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="$(cat "$RUNNER_TEMP/elfienest-artifact-path")"
          dpkg-deb --info "$artifact" >/dev/null
          extract_root="$RUNNER_TEMP/elfienest-deb"
          rm -rf "$extract_root"
          dpkg-deb --extract "$artifact" "$extract_root"
          test -x "$extract_root/opt/ElfieNest/resources/management-cli/ElfieNestCli"
          test -x "$extract_root/opt/ElfieNest/resources/godot-linux-dedicated/ElfieNestRuntime"
          test -f "$extract_root/opt/ElfieNest/resources/manifest.json"
          test -x "$extract_root/opt/ElfieNest/elfienest-gui"
          desktop_entry="$extract_root/usr/share/applications/elfienest-gui.desktop"
          test -f "$desktop_entry"
          grep -q '^Exec=/opt/ElfieNest/elfienest-gui %U$' "$desktop_entry"
          grep -q '^Icon=elfienest-gui$' "$desktop_entry"

      - name: Upload target installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    if: ${{ needs.preflight.outputs.publish_requested == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download native installers
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: installer-*
          path: release-artifacts
          merge-multiple: true

      - name: Aggregate exact target evidence
        run: |
          set -euo pipefail
          python scripts/internal/release/release_evidence.py \
            --candidate-sha "$GITHUB_SHA" \
            --artifact-dir release-artifacts \
            --evidence release-artifacts/ElfieNest-darwin-arm64-install-smoke.json \
            --evidence release-artifacts/ElfieNest-darwin-x64-install-smoke.json \
            --evidence release-artifacts/ElfieNest-win32-x64-install-smoke.json \
            --evidence release-artifacts/ElfieNest-linux-x64-install-smoke.json \
            --output release-artifacts/native-release-evidence.json

      - name: Verify version, targets, and checksums
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          release_tag="${{ needs.preflight.outputs.release_tag }}"
          mapfile -t packages < <(find release-artifacts -maxdepth 1 -type f \( -name '*.pkg' -o -name '*.exe' -o -name '*.deb' \) -print | sort)
          [[ "${#packages[@]}" == "4" ]] || {
            printf 'Expected four installers, found %s\n' "${#packages[@]}" >&2
            exit 1
          }
          (
            cd release-artifacts
            sha256sum ./*.pkg ./*.exe ./*.deb | sed 's#  \./#  #' > SHA256SUMS
          )
          [[ "$(wc -l < release-artifacts/SHA256SUMS)" == "4" ]]
          printf 'release_tag=%s\nversion=%s\n' "$release_tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.metadata.outputs.release_tag }}"
          release_args=()
          if [[ "$release_tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${{ steps.metadata.outputs.release_tag }}" \
            --verify-tag \
            --title "ElfieNest ${{ steps.metadata.outputs.release_tag }}" \
            --generate-notes \
            "${release_args[@]}" \
            release-artifacts/*.pkg \
            release-artifacts/*.exe \
            release-artifacts/*.deb \
            release-artifacts/SHA256SUMS
