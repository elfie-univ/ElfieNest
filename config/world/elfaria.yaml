  - id: nature.light_cycle
    version: 1
    statement: Elfaria 围绕带来白昼的主恒星 Solara 运行；居民长期没有在天空中观测到环绕 Elfaria 运行的天然卫星，因此没有月相周期。一个完整昼夜约 40 个地球小时，迷雾镇历法中一年有 196 个本地日。
    scope: world
    topic: nature_and_physics
    aliases: [Solara, 主恒星, 明暗规律, 光照周期, 天然卫星, 月相]
    retrieval_terms: [Solara, 恒星, 昼夜, 白昼, 天然卫星, 月相, 本地日, "196"]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.light_cycle
    related_ids: []
    eligibility: [all]
  - id: nature.sky_cycle
    version: 1
    statement: Elfaria 围绕 Solara 运行，没有卫星；夜空没有会反复圆缺的月亮，居民不能用月相计时。
    scope: world
    topic: nature_and_physics
    aliases: [没有月亮, 夜空, 月相]
    retrieval_terms: [月亮, 月相, 卫星, 夜空, Solara]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.sky_cycle
    related_ids: [nature.light_cycle]
    eligibility: [all]
  - id: nature.gravity_mobility
    version: 1
    statement: Elfaria 的重力较地球低，精灵跳跃通常更高、滞空略久；跳跃只是短程移动，不能飞行，仍受体力、载荷、地形和环境限制。
    scope: world
    topic: nature_and_physics
    aliases: [低重力, 跳跃, 移动边界, 没有飞行]
    retrieval_terms: [重力, 跳得高, 滞空, 飞行, 载荷, 地形]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.gravity_mobility
    related_ids: []
    eligibility: [all]
  - id: nature.seasons
    version: 1
    statement: 迷雾镇全年温暖，一年只有雨季和旱季两季，每季固定 98 个本地日；雨季炎热、降雨频繁，旱季仍然温暖，只是雨水较少、空气和地表稍干。迷雾镇可以出现气象雾，但不会出现霜、雪，露天地表水也不会自然结冰；Elfaria 其他地区可以有不同季节和气候，可能出现这些现象。
    scope: region
    topic: nature_and_physics
    aliases: [迷雾镇气候, 季节阶段, 时令变化, 雨季, 旱季]
    retrieval_terms: [季节, 时令, 雨季, 旱季, 98 个本地日, 气候, 雾, 霜, 雪, 结冰]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.seasons
    related_ids: []
    eligibility: [all]
  - id: nature.water_cycle
    version: 1
    statement: 在迷雾镇，居民能看到云层聚集后降雨，雨水汇入河流和湖泊，部分水渗入地下；雨季与旱季使水位升落，地面和湿地随后变干。这些现象可以帮助安排取水、渡运和出行，但不等于知道水循环的深层原理；水的来源、地下路径和供水管理若没有具体观察或可靠记录，就只能说不知道，其他地区仍需来源支持。
    scope: region
    topic: nature_and_physics
    aliases: [降雨与河湖, 水位升落, 饮用水, 水循环]
    retrieval_terms: [水, 降雨, 雨季, 旱季, 河流, 湖泊, 水位, 地面变干, 湿地, 取水, 渡运, 饮用]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.water_cycle
    related_ids: []
    eligibility: [all]
  - id: nature.magnetic_tide
    version: 1
    statement: 每年会出现一次磁场潮：通信先逐渐变乱，天空在高峰附近常出现彩色光幕，之后进入较长的静默期；总持续时间和成因没有统一可靠的说法。
    scope: world
    topic: nature_and_physics
    aliases: [磁场潮, 光幕, 静默期]
    retrieval_terms: [磁场潮, 通信变乱, 光幕, 静默期]
    level: common
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.magnetic_tide
    related_ids: []
    eligibility: [all]
  - id: nature.underground_recovery
    version: 1
    statement: 深地下没有可直接利用的日光，精灵在那里活动和修复通常更慢，需要依靠当地可用的热源、矿物或其他补充；具体原因属于专业知识或未知。
    scope: region
    topic: nature_and_physics
    aliases: [深地下恢复, 地下补充]
    retrieval_terms: [深地下, 恢复变慢, 日光, 热源, 矿物]
    level: specialist
    certainty: high
    status: active
    source_ref: canon:elfaria-world.v0.1#nature.underground_recovery
    related_ids: []
    eligibility: [all]
  - id: nature.life_needs
    version: 1
    statement: 精灵个体需要从环境中获得能量和身体材料，也需要补充、休息、恢复和安全空间；不同物种的具体需求和表达方式并不完全相同，精灵不必固定一日三餐。
