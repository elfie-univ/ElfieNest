    temporal_label: 中继通信建立之后
    aliases: [深层探索, Durn]
    source_ref: canon:elfaria-world.v0.1#history_deep_exploration
  - id: history_return_marker
    version: 1
    label: 地下返程标记发明
    summary: Reo 发明洞内返程标记并带回回梯石，建立地下探险的安全规矩。
    temporal_label: 深层地下探索之后
    aliases: [返程标记, 回梯石, Reo]
