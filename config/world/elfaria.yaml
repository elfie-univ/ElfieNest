    certainty: high
    status: unknown-boundary
    source_ref: canon:elfaria-world.v0.1#boundary.undercity_interior
    related_ids: [undercity, culture.undercity_myths]
    eligibility: [all]
unknown_boundaries:
  - Elfaria 的完整星球地图、未批准区域和远方地点
  - 迷雾镇更早历史的具体年代、地方叙事细节和每个家庭的旧事
  - 迷雾镇全域的可靠人口总数、每个外围聚落的精确位置和未登记道路
  - 作者使用的公里坐标、网格、随机出生点和路径计算，不是居民日常知识
  - 未亲历的具体天气、当天位置、实时活动、动作和巢内状态
  - 没有来源支持的地球技术细节或其他 Elfie 的私人经历
