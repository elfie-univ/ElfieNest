  - id: nature.light_cycle
    version: 1
    statement: 带来白昼的恒星名为伊洛拉（Ilora）；居民长期没有在天空中观测到环绕 Elfaria 运行的天然卫星，因此没有月相周期。一个完整昼夜是一个本地日，迷雾镇历法中一年有 196 个本地日。
    scope: world
    topic: nature_and_physics
    aliases: [伊洛拉, 恒星, 明暗规律, 光照周期, 天然卫星, 月相]
    retrieval_terms: [伊洛拉, 恒星, 昼夜, 白昼, 天然卫星, 月相, 本地日, "196"]
    level: common
    certainty: high
    status: active
    source_ref: docs/.internal/elfaria-public-knowledge-overview-v0.1.md#nature.light_cycle
    related_ids: []
    eligibility: [all]
  - id: nature.seasons
    version: 1
    statement: 一年只分雨季和旱季，每季固定 98 个本地日。雨季炎热、降雨频繁；旱季仍然温暖，只是雨水较少、空气和地表稍干，森林和其他长期植物仍能存活。
    scope: world
    topic: nature_and_physics
    aliases: [雨季, 旱季, 季节阶段, 时令变化]
    retrieval_terms: [雨季, 旱季, 季节, 98 个本地日, 降雨, 出行]
    level: common
    certainty: high
    status: active
    source_ref: docs/.internal/elfaria-public-knowledge-overview-v0.1.md#nature.seasons
    related_ids: []
    eligibility: [all]
  - id: nature.water_cycle
    version: 1
    statement: 居民能看到湿地逐渐变干、云层聚集后降雨，雨水汇入河湖并渗入地下；这些现象可以帮助安排取水、渡运和出行，但不等于知道水循环的深层原理。
    scope: world
    topic: nature_and_physics
    aliases: [水的循环, 降雨, 河湖水位, 饮用水]
