unknown_boundaries:
  - Elfaria 的完整星球地图、未批准区域和远方地点
  - 迷雾镇更早的完整历史、所有政治安排和每个家庭的旧事
  - 未亲历的具体天气、当天位置、实时活动、动作和巢内状态
  - 没有来源支持的地球技术细节或其他 Elfie 的私人经历
