network:
  node_model:
    grid_cell_is_node: true
    named_place_does_not_create_edge: true
    adjacent_grid_cells_are_not_implicitly_connected: true
    local_and_backbone_edges_are_derived_by_runtime: true
  land_backbone_paths:
    - [R8C3, R7C3, R6C3]
    - [R6C3, R5C2, R4C2, R4C3]
    - [R6C3, R6C4, R5C4]
    - [R7C4, R6C4, R5C4]
    - [R5C4, R6C5, R5C6, R4C6, R4C7, R5C8]
    - [R5C4, R4C3]
    - [R4C3, R3C2, R2C2]
    - [R4C3, R3C3, R3C4]
    - [R5C4, R4C4, R3C4]
    - [R5C4, R4C5, R3C5]
    - [R3C4, R2C3, R1C3, R0C3]
    - [R3C4, R2C4, R2C5, R1C5]
    - [R0C3, R1C4, R1C5]
    - [R1C5, R0C3, R0C7]
    - [R0C7, R0C8, R0C9]
    - [R3C1, R3C2]
  land_backbone_edge_rule:
    derive_from: consecutive_cells_in_land_backbone_paths
    each_consecutive_pair_is_one_land_grid_hop: true
    do_not_interpolate_undeclared_cells: true
    direction: bidirectional
    expected_unique_edge_count: 35
    expected_unique_node_count: 32
  water:
    ferry_nodes: [R3C5, R1C5, R4C7, R0C7]
    connectivity: complete_undirected
    expected_edge_count: 6
    edge_cost_kind: water_day
    grid_hop_definition: shortest_water_cell_chain_between_ferry_nodes
    grid_hop_edges:
      - {from: R3C5, to: R1C5, water_grid_hops: 4}
      - {from: R3C5, to: R4C7, water_grid_hops: 3}
      - {from: R3C5, to: R0C7, water_grid_hops: 5}
      - {from: R1C5, to: R4C7, water_grid_hops: 5}
      - {from: R1C5, to: R0C7, water_grid_hops: 3}
      - {from: R4C7, to: R0C7, water_grid_hops: 4}
    grid_hop_edges_are_undirected: true
    requires_boat_or_ferry: true
    requires_service_or_vessel: true
    cost_is_higher_than_land: true
    cost_model: upper_layer_boat_or_ferry_service_cost
    island_destinations:
      - {place_id: lakeheart_isle, cell: R1C7, from_ferry: R0C7, mode: water, water_grid_hops: 1}
  local_roads:
    generation: runtime
    allowed_when:
      - four_direction_adjacent
      - each_adjacent_pair_is_one_land_grid_hop
      - same_region_code
      - both_cells_habitable
      - no_river_or_water_barrier
    cross_region_rule: use_explicit_land_backbone_or_water_route
    no_explicit_cell_edge_list: true
  forbidden_shortcuts:
    - {from: E, to: lakeheart_isle_surface, mode: land, reason: 湖面不可直接步行}
    - {from: R5C4, to: R5C6, mode: land, reason: 跨区域必须使用显式道路}

travel_policy:
  distance_is_time_not_length: true
  land_day_kind: walk_day
  water_day_kind: water_day
  days_shape: integer
  land_days_per_grid_hop: 2
  land_formula: legal_land_grid_hops * land_days_per_grid_hop
  water_days_per_grid_hop: 3
  water_formula: water_grid_hops * water_days_per_grid_hop
  land_is_faster_than_water: true
  water_requires_boat_or_ferry: true
  water_cost_is_upper_layer_service_cost: true
  edge_values_status: grid_hop_rule_confirmed
  unresolved_land_backbone_edges: 0
  unresolved_water_edges: 0
  no_pixel_or_straight_line_conversion: true

place_grid_policy:
  point_place_requires_one_cell: true
  range_place_uses_region_or_cell_set: true
  same_cell_may_contain_multiple_places: true
  town_center_is_point_within_host_cell: true
  clearheart_lake_is_range_not_point: true
  cloudcrown_and_skymirror_share_cell: true

population:
  selection_order:
    - user_selected_species
    - uniform_allowed_region
    - uniform_cell_within_selected_region
  species_selection:
    source: user_input
    allowed_regions_from: regions[].allowed_species
    allowlist_is_hard_constraint: true
  ordinary_birth_scope: selected_species_allowed_regions
  excluded_regions: [E, X]
  region_sampling:
    distribution: uniform_over_allowed_regions_for_selected_species
    derive_regions_from: regions[].allowed_species
  cell_sampling:
    distribution: uniform_over_cells_in_selected_region
    derive_cells_from: grid.region_matrix
  allocation_rule: selected_species_uniform_region_then_uniform_cell
  no_fixed_population_per_cell: true

species_policy:
  canonical_names: [Saevi, Tovren, Myelle]
  allowed_species_source: regions[].allowed_species
  region_allowlist_is_hard_constraint: true
  selection_source: user_selected_species
  single_species_regions: [A1, A2, B, C1, C2, C3]
  central_mixed_region: D
  no_species_regions: [E, X]
  survival_is_not_personality_or_occupation: true

validation:
