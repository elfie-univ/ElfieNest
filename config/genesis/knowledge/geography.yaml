design_boundary:
  map_is_abstract: true
  grid_is_sampling_container_not_scale_map: true
  cell_is_not_a_residence_or_full_settlement_footprint: true
  logical_place_grid_assignment_is_authoritative: true
  route_topology_is_explicit_user_reviewed_input: true
  no_place_or_residence_is_inferred_from_map_pixels: true
  runtime_travel_unit: local_travel_days
  kilometer_runtime_fields_forbidden: true

grid:
  dimensions: [10, 10]
  unit_count: 100
  row_order: south_to_north
  column_order: west_to_east
  cell_id_format: u-r{row:02d}-c{column:02d}
  display_label_format: R{row}C{column}
  cell_is_sampling_container: true
  cell_is_not_residence: true
  region_matrix:
    - [A1, A1, C2, C2, C2, C3, C3, C3, C3, A2]
    - [A1, A1, C2, C2, C2, C3, E, E, E, A2]
    - [A1, C2, C1, C1, C1, C3, E, E, E, A2]
    - [A1, C2, C1, C1, D, D, E, E, B, A2]
    - [A1, A1, C1, D, D, D, B, B, B, B]
    - [A1, A1, C1, C1, D, D, B, B, B, B]
    - [A1, A1, A1, A1, D, B, B, B, B, B]
    - [X, A1, A1, A1, A1, A1, B, B, B, B]
    - [X, X, A1, A1, A1, A1, A1, B, X, X]
    - [X, X, A1, A1, A1, A1, A1, A1, X, X]
  derived_cell_fields:
    source: region_matrix_and_region_rules
    fields:
      - region_id
      - macro_region
      - terrain
      - component_id
      - habitable
      - birth_eligible
      - allowed_species
      - local_road_eligibility
      - place_ids
      - backbone_node
      - ferry_node
    rule: do_not_materialize_one_record_per_cell_in_this_source

