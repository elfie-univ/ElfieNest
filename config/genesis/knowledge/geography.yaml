  birth_eligible_cells_reachable_from_town_center: 83
  all_birth_eligible_cells_reachable: true
  water_ferry_node_count: 4
  water_edge_count: 6
  water_grid_hop_edges: 6
  land_days_per_grid_hop: 2
  water_days_per_grid_hop: 3
  birth_eligible_regions_have_allowed_species: true
  place_count: 36
  all_place_refs_are_cell_or_region_based: true
  all_network_refs_are_matrix_cells_or_declared_places: true
  no_materialized_sampling_units: true
  no_kilometer_runtime_fields: true
  topology_status: complete_for_16_reviewed_source_paths
  travel_time_status: grid_hop_rule_confirmed
  publication_ready: true
  blockers: []
