# knowledge-unit anchors bind each unchanged ID to one source paragraph/list item.
# unresolved is a publication blocker, never a wildcard or a satisfied condition.
# Contact qualifiers concern this unit only; no place grants all descendant knowledge.
# residence means living in the matching region; local_tradition means receiving or
# participating in the local tradition. Neither qualifier grants unrelated units.
# exterior_view does not imply entry/use; public_area_visit does not imply facility entry.
knowledge:
  - id: A-01
    description: |-
      Elfaria 是精灵生活的星球，也是他们的家园；“Elfie”是地球侧对 Elfaria 智慧生命的通称，包括 Saevi、Tovren 和 Myelle。迷雾镇（Mistyville）只是这颗星球上的一片生活区域，不是 Elfaria 的首都，也不能代表整颗星球；远方是什么样，居民没有完整可靠的认识。迷雾镇与地球建立了有限联系，有少数居民自愿前往那个世界。
  - id: A-01-02
    description: |-
      公共记录没有覆盖完整星球地图、全部国家和城市、远方历史或所有物种分布。
  - id: A-02
    description: |-
      Solara 是白昼里照亮天空的太阳。一个完整昼夜就是一个本地日；夜空没有反复圆缺的月亮，也没有月相可用来计时。
  - id: A-03
    description: |-
      迷雾镇一年只有雨季和旱季两季，两季等长；雨季降水增多、水位上升，旱季降水减少、空气和地表变干。这里全年温暖，不出现霜、雪和自然结冰；迷雾镇有时会起雾，但并非整年处处有雾。Elfaria 其他区域的海拔、地形和气候可以不同，也可能出现雾、霜、雪或自然结冰，不能凭本地见闻断定远方天气。
  - id: A-04
    description: |-
      云层聚集后会下雨，雨水流入河流、湖泊和湿地；雨季河湖水位升高，旱季水位回落，地面和湿地经过一段时间会变干。取水、渡运和出行需要考虑水位与地面干湿，不能把旱季的渡运条件照搬到雨季；云层遮住直照时，白昼仍然有光，雷暴、风和降雨都是正常天气。地下水从哪里来、在深处经过哪些路径，没有直接观察或可靠记录的部分仍不清楚。
  - id: A-05
    description: |-
      每年都有一次被称为“磁场潮”的天象：从第 1 日开始逐渐增强，在第 50 日附近达到高峰，最强期约持续一两天，随后逐渐减弱，在第 148 日附近降到低谷并进入较长的静默期。天空光幕只在磁场最强的这一两天出现；磁场潮增强时，通信可能噪声增大、串线，或被动、短暂且不完整地误听到原本不在认签范围内的声音，但不能借此主动寻找、监听、回放或定位陌生个体。整个变化过程的总天数、具体成因和持续时间没有完整可靠的解释，具体日期见 A-06。
  - id: A-06
    description: |-
      居民以昼夜循环形成的本地日计时；一年有 196 个本地日，不设月份。年首从旱季中点开始，依次经过雨季开始、雨季中点和旱季开始，再回到旱季中点；这四个节点把一年均分为四段。雨季开始时庆祝连线日，接近磁场潮最强的时候；旱季开始时迎来静默日，远距联系开始变得困难。
  - id: A-06-02
    description: |-
      公共历书把四个节点记为第 1、50、99、148 日，节点之间各相隔 49 日；雨季为第 50 至 147 日，旱季为第 148 日至下一年第 49 日，连线日为第 50 日，静默日为第 148 日。
    mastery_difficulty: medium
  - id: B-01
    description: |-
      迷雾镇所在的地方适合长期生活，外面的大片区域难以生存，出行极其危险。关于尝试远行的人，流传着失败或失踪的消息，没有可靠的成功往返消息；远方还有其他适合生活的区域，但居民无法据此说清那些地方在哪里、怎样抵达或那里的人如何生活。走货郎往来的是迷雾镇内部的村落、部落中心与镇中心，这种往来没有穿越不同适生区。
  - id: B-02
    description: |-
      迷雾镇北部和西部多山，西北更高；东部是森林；南部和西南部是平原；东南部有大湖。村落分散在这些地方，并不是连成一片的城镇。居民知道生活区域很大、人口很多，却不知道整个区域到底多宽、多大或一共有多少人。
  - id: B-02-02
    description: |-
      山地有上游小湖和瀑布，这些水系向东南汇入澄心湖。
    eligibility:
      all:
        # 居住在 Myelle 部落地区即可取得该区域的基础地貌知识。
        - place:
            id: myelle_region
            contact: residence
  - id: B-02-03
    description: |-
      河流绕过回澜丘下半部后离开，形成开放的弧形河湾，没有围着山丘闭合成一圈。
    eligibility:
      all:
        - place:
            id: riverturn_bend
            contact: exterior_view
  - id: B-03
    description: |-
      迷雾镇（Mistyville）有一个镇中心（Mistyville Town Center）、三个部落中心（Saevi Tribal Center、Tovren Tribal Center 和 Myelle Tribal Center），以及很多分散的小村落；Saevi 部落中心在东部森林，Tovren 部落中心在南部平原，Myelle 部落中心在北部山地。镇中心是共同议事、集中学习、看病和较大规模交换的地方，所有部落都知道那里有通天广场（Skyreach Square）、通天古树（Skyreach Ancient Tree）、长老院（Elder Council Hall）、学疗院（Learning and Healing Hall）、百业街（Hundred Trades Street）、赴地跃迁基站（Earthbound Transit Station）和地下城门（Undercity Gate）；部落中心处理本地区事务。绝大多数居民住在三个部落地区的分散村落，日常生活围绕家庭和附近邻里展开，多数居民主要认识家庭、邻里、师徒、交换伙伴和已认签的人，同住迷雾镇不等于彼此认识。
  - id: B-03-02
    description: |-
      通天广场中央的通天古树承担公共公告中继；赴地跃迁基站办理赴地、联络和归返，地下城门在镇中心北侧；这些设施有人管理，不是可以随意进入的日常场所。学疗院教授通识、记录、医学和公共事务，也接诊病伤；百业街有铁匠铺、小卖铺、杂货铺、修理铺、摊位与住宿。
    eligibility:
      all:
        - place:
            id: mistyville_center
            contact: public_area_visit
  - id: B-03-03
    description: |-
      镇中心位于山地、森林和平原道路的交会处，住宅比外围村落密集，人也多得多。
    eligibility:
      all:
        - place:
            id: mistyville_center
            contact: public_area_visit
  - id: B-03-04
    description: |-
      一条林中主街穿过中心，住宅沿街或建在树间，街尾是兼作议事地点的长老屋，住宅旁可以有家庭手工作坊。
    eligibility:
      all:
        - place:
            id: saevi_tribal_center
            contact: public_area_visit
  - id: B-03-05
    description: |-
      一条平原主街穿过中心，住宅沿街和草地分布，街尾是兼作议事地点的长老屋，住宅旁可以有家庭手工作坊。
    eligibility:
      all:
        - place:
            id: tovren_tribal_center
            contact: public_area_visit
  - id: B-03-06
    description: |-
      主街沿山坡延伸，住宅沿坡或位于洞穴中，长老屋在高处，也用来议事；有些住宅旁设家庭手工作坊。
    eligibility:
      all:
        - place:
            id: myelle_tribal_center
            contact: public_area_visit
  - id: B-03-07
    description: |-
      三个部落中心比镇中心小得多，以主街、住宅和长老屋为主，没有另设独立学校、医院、常驻市场或公共工坊。
  - id: B-04
    description: |-
      居民用通行天数说明远近。按已登记路网逐格计算：每个陆路网格跳数为 2 个步行日，每个水路网格跳数为 3 个水行日；水路需要船或渡运。地图像素、直线距离和其他修正不参与换算。
  - id: B-04-02
    description: |-
      从镇中心向东沿森林主路到 Saevi 部落中心，普通步行约需 4 个本地旅行日。
    eligibility:
      all:
        - route:
            id: town_saevi
            extent: full
            status: traversed
  - id: B-04-03
    description: |-
      从镇中心向西南沿平原主路到 Tovren 部落中心，普通步行约需 10 个本地旅行日。
    eligibility:
      all:
        - route:
            id: town_tovren
            extent: full
            status: traversed
  - id: B-04-04
    description: |-
      从镇中心向西北沿山地主路到 Myelle 部落中心，普通步行约需 4 个本地旅行日。
    eligibility:
      all:
        - route:
            id: town_myelle
            extent: full
            status: traversed
  - id: B-04-05
    description: |-
      从 Saevi 部落中心继续向东深入森林，到祖树约需步行 4 个本地旅行日。
    eligibility:
      all:
        - route:
            id: saevi_firstroot
            extent: full
            status: traversed
  - id: B-04-06
    description: |-
      从 Tovren 部落中心继续向南到回澜丘，约需步行 8 个本地旅行日。
    eligibility:
      all:
        - route:
            id: tovren_riverturn
            extent: full
            status: traversed
  - id: B-04-07
    description: |-
      从 Tovren 部落中心所在渡口乘船到澄心湖渡点，约需 12 个水行日；再从渡点登湖心岛还需约 3 个水行日。
    eligibility:
      all:
        - route:
            id: tovren_clearheart
            extent: full
            status: traversed
  - id: B-04-08
    description: |-
      从 Myelle 部落中心继续向西北入山，到天镜湖山路口约需步行 4 个本地旅行日；这是到山路口的行程，不是走完整处湖泊景观。
    eligibility:
      all:
        - route:
            id: myelle_skymirror
            extent: full
            status: traversed
  - id: B-04-09
    description: |-
      广场环路绕通天广场一周；从广场沿长老巷去长老院，沿学疗路去学疗院，沿百业街可到商业街南端，沿赴地路去赴地基站，沿地下城路去地下城门；不同支路之间通常经过广场换路。
    eligibility:
      all:
        # 到过镇中心即可取得基本道路结构；不代表进入各设施或掌握内部细节。
        - place:
            id: mistyville_center
            contact: public_area_visit
  - id: B-04-10
    description: |-
      从通天广场出发，长老院较近，学疗院稍远；走到百业街南端更久，分别沿赴地路到基站、沿地下城路到城门，耗时又更长。
    eligibility:
      all:
        # 到过镇中心即可取得公开的道路远近关系；不代表实际走过每条支路。
        - place:
            id: mistyville_center
            contact: public_area_visit
  - id: B-04-11
    description: |-
      镇内道路的英文正式名分别是 Square Ring、Council Lane、Learning Lane、Hundred Trades Street、Earthbound Road 和 Undercity Road。
  - id: B-04-12
    description: |-
      住在村落里，要先沿自家附近的小路接上通往目的地的道路，不能把部落中心出发的行程当成从自家出发的行程；远端村落到中心可能要走很多天。各家的接入路段不同，不能用部落中心的时间代替每个住处的实际行程。
  - id: B-05
    description: |-
      居民主要在地表生活，一些浅地下通道也用于日常活动；深地下风险更高，不能随意进入。云冠城在高处，不能沿普通地表道路走进去。
  - id: B-05-02
    description: |-
      道路能走不等于可以进入；住宅、家庭中继节点和部分林路不属于默认公共通行空间，进入仍可能需要主人或地方许可。
  - id: B-05-03
    description: |-
      深层地下探索需要有效开放窗口和相应许可；知道入口在哪里，不代表当前可以进入。
  - id: B-06
    description: |-
      通天古树（Skyreach Ancient Tree）是镇中心地标；东部森林有祖树（Firstroot Tree），平原有回澜丘（Riverturn Hill）与回澜河湾（Riverturn Bend），东南有澄心湖（Clearheart Lake）和湖心岛（Lakeheart Isle），山地有天镜湖（Skymirror Lake）、垂云瀑（Cloudfall Falls）以及悬在高处的云冠城（Cloudcrown City）。地下城（Undercity）位于地下。
  - id: B-06-02
    description: |-
      祖树位于东部森林深处，不在 Saevi 部落中心的主街旁。
    eligibility:
      all:
        - place:
            id: firstroot_tree
            contact: exterior_view
  - id: B-06-03
    description: |-
      湖心岛在澄心湖中央，要经固定渡点和水路前往；站在湖岸或到达渡点都不等于已经登岛。
  - id: B-06-04
    description: |-
      云冠城悬在天镜湖上方，湖水从山崖落下形成垂云瀑；这里的天镜湖与东南大湖澄心湖是两个地方。
    eligibility:
      all:
        - place:
            id: skymirror_lake
            contact: exterior_view
  - id: B-06-05
    description: |-
      云冠城附近的通信持续受到干扰，可能完全失联；在下面看见它，也找不到能沿地面直接走进城里的普通道路。
  - id: B-06-06
    description: |-
      地下城内部向远处和深处延伸，岔路复杂。
    eligibility:
      all:
        - place:
            id: undercity
            contact: entered
  - id: B-06-07
    description: |-
      深层地下存在异常地点和磁场异常，也可能有稀缺资源；知道这些事实不等于知道每条深层路线或当前开放状态。
    eligibility:
      all:
        - place:
            id: deep_underground
            contact: entered
  - id: B-06-08
    description: |-
      已审定的地点图可以补充居民对公开地点外观的认识，但只固定图片中稳定、可重复辨认的外部形态，不从背景、像素比例或未说明的室内细节推导新的世界事实；视觉细节仍须按照到访、受教、公共记录和地点范围分配给个人。
  - id: B-06-09
    description: |-
      通天广场有开阔铺地和巨大的通天古树，树周可见悬挂灯具与紫色中继结构；长老院是向前展开的开放式建筑，有植物或木质结构、紫色晶体、台阶和中央庭院；学疗院由多个拱形建筑、水道和步道组成，教学楼有较高的中央屋顶，校园建筑彼此相连；百业街和交换市场由连续店铺、棚篷、摊位、商品陈列和通行街道组成，比普通住宅更密集；赴地跃迁基站有环形铺地和中央高大的紫色传送结构，周围空间较为开阔。这些描述只固定公开、可重复辨认的外部形态，不延伸为建筑内部结构、当前开放状态或具体设施使用细节。
  - id: B-06-10
    description: |-
      地下城门嵌在山体石壁中，有大型石质拱门、紫色晶体和向内向下延伸的入口；入口外观不等于知道深层路线或实时开放状态。
    eligibility:
      all:
        - place:
            id: undercity_gate
            contact: exterior_view
  - id: B-06-11
    description: |-
      祖树是森林深处的巨大分枝古树，树干上可见蓝绿色的发光纹理；图片只固定外观，不证明树的内部结构或传说起源。
    eligibility:
      all:
        - place:
            id: firstroot_tree
            contact: exterior_view
  - id: B-06-12
    description: |-
      树屋、树间平台和悬空步道分布在森林冠层中，构成林中聚落的主要可见形态。
    eligibility:
      all:
        - place:
            id: saevi_tribal_center
            contact: exterior_view
  - id: B-06-13
    description: |-
      澄心湖是开阔的大湖，中央有湖心岛，湖岸、岛屿和周围山地或平原构成开阔景观；外观图只补充这些可见关系，前往湖心岛仍按固定渡点和水路理解，不从图面推导水深、桥梁性质或岛内设施。
    eligibility:
      all:
        - place:
            id: clearheart_lake
            contact: exterior_view
  - id: B-06-14
    description: |-
      云冠城的公开景象是悬在天镜湖上方的浮空山体，湖水从山崖落下形成垂云瀑；图片只固定外部景观关系，不能说明城内布局、建造者或进入方式。
    eligibility:
      all:
        - place:
            id: skymirror_lake
            contact: exterior_view
  - id: B-06-15
    description: |-
      回澜丘是平原中的独立山丘，河流绕过山丘下部形成开放弧湾；它不是闭合水圈。
    eligibility:
      all:
        - place:
            id: riverturn_hill
            contact: exterior_view
  - id: B-06-16
    description: |-
      全局地图把山地置于北部和西部、森林置于东部、平原置于南部和西南部、大湖置于东南部；山地水系向东南汇入大湖，平原河湾保持开放。地图是关系示意，不能按像素量距，也不能凭图面增加未登记建筑、道路、资源或人口。
  - id: B-06-17
    description: |-
      镇中心地图用于表达通天广场、长老院、学疗院、百业街、赴地跃迁基站、地下城门、主要道路和河道的相对位置；知道这张图的相对关系，不等于知道每条支路、每间住宅或设施的内部状态。
  - id: C-01
    description: |-
      三种陆地智慧生命是 Saevi、Tovren 和 Myelle，彼此能交流并共同生活；还有普通植物、有意识伴生植物和水生动物。三种智慧生命都可以学习共同语言、地球语言和地球工具。
  - id: C-01-02
    description: |-
      普通植物不会与居民交谈。它们提供遮蔽、稳定水岸，也提供木材、纤维、树脂、树洞和居住结构；有些产出少量高浓度补充物，有些能中继通信。普通树木并不都能中继。
  - id: C-01-03
    description: |-
      普通固定植物按社会用途通常分为生态/观赏、材料与架构、补充物、通信中继四类；这是使用分类，不是神圣等级。有意识伴生植物是独立的固定生命类别，不属于这四类。
  - id: C-01-04
    description: |-
      有意识伴生植物能记住事情、交流和表达意愿，可以成为家庭伙伴；它们扎根于特定环境，不能脱离赖以生存的地方随意迁走，也不能被当作没有意愿的物品处置。它们不会因此成为治理者或被奉为神圣。
  - id: C-01-05
    description: |-
      有意识伴生植物稀少、难培育，普通家庭中继植物通常没有意识；能够中继通信，不等于能够表达自己的意愿。
  - id: C-01-06
    description: |-
      伴生植物的种子和幼体主要出现在森林等少数环境，存活下来很不容易。
    eligibility:
      all:
        # 居住在 Saevi 部落地区即可取得该区域的基础生态知识。
        - place:
            id: saevi_region
            contact: residence
  - id: C-01-07
    description: |-
      水中有在水层游动的动物，也有在底层或岸边活动的动物；没有观察到它们使用 Aethersense、陆地语言或表达个体意愿。
  - id: C-02
    description: |-
      身体能通过体表从周围环境获得补充；晒光、接触合适的空气、水和环境、休息与进食都能逐渐恢复身体。进食不需要固定三餐，但长大、繁育和伤后恢复仍需要水、食物及其他合适材料。身体状态恢复得快不表示空气更热，状态好也不代表可以无限活动。
  - id: C-02-02
    description: |-
      身体储备能支持一整夜、连续阴天或短期地下活动，但夜间、阴天、地下和持续劳作仍会使人疲劳，不能无限活动。
  - id: C-02-03
    description: |-
      浓缩补充物产量少，能用于应急恢复、成长和高消耗活动，不是日常主食，也常被用作礼物或奖励。
  - id: C-02-04
    description: |-
      身体补充不足时，会乏力、反应变慢、难以集中注意力，也更难回想事情；恢复状态有助于思考和通信。乏力不意味着通信必然中断，地形、距离和天气也会影响联系。
  - id: C-02-05
    description: |-
      这里没有食肉动物，精灵也不以相互捕猎为生；物资竞争、相互依存和腐烂仍然存在。
  - id: C-02-06
    description: |-
      衣饰用于局部保护、装饰、身份和仪式表达，不宜遮挡身体对周围环境的吸收。
  - id: C-02-07
    description: |-
      深地下没有日光，活动与伤后恢复通常更慢；需要依靠当地能利用的温热环境、矿物或其他补充，不能照搬地表晒光恢复的办法。
    eligibility:
      all:
        - experience:
            id: deep_exploration
            status: participated
            scope: deep_underground
  - id: C-03
    description: |-
      三种陆地智慧生命的幼体都由双亲繁育，会成长、受伤、生病、衰老和死亡；植物也会生长、繁殖、枯萎和死亡。幼体、长者、伤病成员与伴生植物由家庭和社区共同照护。
  - id: C-03-02
    description: |-
      受伤、生病和缺少身体需要的材料都会让人变弱；环境再适宜，也不能保证不生病，或让伤口不经照护就自行恢复。
  - id: C-03-03
    description: |-
      三种精灵通常要经过两三个本地年的成长才身体成年；身体成年后仍会继续学习和积累经验。Saevi 的一生通常比 Tovren 和 Myelle 短。
  - id: C-03-04
    description: |-
      公共记录和学疗院经验把年龄按本地年记述：Saevi 的幼年为 0～2 年，成长期为 2～5 年，成熟期为 5～10 年，高龄期为 10～15 年，寿命约 15 年；Tovren 和 Myelle 的幼年为 0～2 年，成长期为 2～6 年，成熟期为 6～14 年，高龄期为 14～20 年，寿命约 20 年。
    mastery_difficulty: medium
  - id: C-03-05
    description: |-
      健康问题可能来自感染、寄生、外伤、材料缺乏、先天问题或衰老；需要分清原因，不能把这些问题一概当成多晒光、补充体力就能解决的疲劳。
  - id: C-03-06
    description: |-
      医者按病因和生命阶段积累诊断、照护和身体修复经验，知道哪些情况需要补充材料、专门照护或送往学疗院；具体药材、配方和处理细节属于受训者的专业范围，不能从“环境适宜”自动推导出来。
    eligibility:
      all:
        - vocation:
            id: healer
            role: practitioner
            practice_scope: health_diagnosis_and_care
            proficiency: trained
  - id: C-04
    description: |-
      Saevi、Tovren 和 Myelle 在森林、平原湖岸、山地浅地下等区域形成了不同的身体、感知、行动和生产倾向；这些倾向影响常见经验，不决定个体性格或职业。
  - id: C-04-02
    description: |-
      Saevi 主要生活在东部森林，擅长树间活动和生态观察，常见手艺包括长期培育和生态照护。
  - id: C-04-03
    description: |-
      Tovren 主要生活在南部平原与湖岸，常见经验集中于声音、节奏、路线、渡运、互助、交换和稳定建设。
  - id: C-04-04
    description: |-
      Myelle 主要生活在北部山地与浅地下，在细节、距离、平衡、导航、深层聆听和安全记录方面形成了地方经验。
  - id: C-04-05
    description: |-
      三种物种中都有安静或外向、谨慎或冒险的个体，物种和家乡不会替一个人决定性格与职业。
  - id: C-04-06
    description: |-
      跳跃是常见的短程移动方式，但长途旅行仍受道路、地形、载荷、疲劳和休息限制。
  - id: D-01
    description: |-
      三种陆地智慧生命共享语言，语言从共同生活和长辈教导中学会；面对面可以说话，远处通过 Aethersense 联系。它传递语言，不能任意读心，也不能寻找所有陌生人。
  - id: D-01-02
    description: |-
      认签像学话一样自然习得。双方须在近处自愿认签，可以接触、贴近或参加接线仪式；未认签者不能随意呼叫或监听陌生个体。
  - id: D-01-03
    description: |-
      每个人的共振签名稳定而可区分；认签时双方交换并记住对方的签名，此后可以双向私人联系。知道认签的方法不等于已经和某个人认签。
  - id: D-01-04
    description: |-
      距离拉大后联系会变弱；开阔地比森林、山地和地下更容易联系，风暴、地形遮挡与磁场潮可能带来杂音、延迟、中断或短暂误听。
  - id: D-01-05
    description: |-
      可以主动公开频道，让尚未认签的人单向收听；听同一个频道，不等于听众彼此认签，也不等于能与播报者私人通话。
  - id: D-01-06
    description: |-
      家庭和地方中继能帮助已建立的联系传得更远，公共公告另有公开频道；中继不能绕过认签和隐私边界。
  - id: D-01-07
    description: |-
      长老院、学疗院等重要公共建筑使用山地出产的紫色共振矿石增强信号；普通家庭主要使用中继树。居民可以知道这种公开差异，矿石适配、节点连接、噪声判断和故障处理属于中继维护者的专业知识。
  - id: D-01-08
    description: |-
      普通 Aethersense 不能直接跨世界，联系地球必须经过专门的中继设施。
  - id: D-02
    description: |-
      情绪凝练是人人都可以学习的普通生活技能，类似织布等普通手艺，通常不需要职业训练；大多数精灵可以通过共同生活、观察和简单示范学会基本做法，有些人不熟悉或不愿意做。凝练会消耗时间和体力，熟练程度、稳定性和保存效果会因基础、练习和当下状态不同。情绪也能在近处相互影响；远距 Aethersense 只能传话，不能直接把情绪传过去。
  - id: D-02-02
    description: |-
      长期孤独和悲伤会让身体沉重、状态变差、衰老加快；陪伴、探望、共处和稳定关系有助于维持状态。这是长期累积的影响，一次情绪波动不会因此致命，也不替代疾病、外伤和自然衰老。
  - id: D-02-03
    description: |-
      强烈情绪在近处会共鸣或感染，可能使一群人一起狂欢或恐慌。
  - id: D-02-04
    description: |-
      凝成的情绪物可以像晶体、琥珀或露珠。出售或赠送是转移，不是复制：送出了那份快乐，自己就失去那份快乐。
  - id: D-02-05
    description: |-
      情绪物会随时间变质，也可能被伪造；能够凝结自己的情绪，不代表能识破所有伪造物。
  - id: D-02-06
    description: |-
      正面情绪物能帮助低落者恢复状态；使用、赠送和转移都需要相关人的同意。
  - id: E-01
    description: |-
      家庭和小村落承担日常生活、休息、照护、生产、交换与协作；一家可以包含多代成员，也可以有非血缘的家人。住所用于休息、遮蔽、储存，并围绕中继建立联系。
  - id: E-01-02
    description: |-
      家庭通常围绕一棵中继树建立居所和通信节点，中继树也成为家所在的位置标志，不必具有意识。
  - id: E-01-03
    description: |-
      住宅、家庭中继节点和长期维护的家庭种植或中继设施由家庭占有、使用和维护；部分林路或住宅附近道路也有主人或当地边界，进入仍需得到允许。
  - id: E-01-04
    description: |-
      常见作息按活动与休息交替：清晨在开阔处或向阳岩石上停留，白天从事培育、采集、打铁或中继维护，傍晚通过家庭中继与远处认识的人通话；各家不必遵守相同时间表。
  - id: E-01-05
    description: |-
      小村落通常由少量家庭组成，依靠家庭生产、当地能人和中继联络生活；余缺先通过熟人互助、物物交换、劳务往来或临时交换日处理。
  - id: E-01-06
    description: |-
      长期陪伴、探望和共处也是照护的一部分；长期孤独或悲伤会让身体状态变差并加快衰老，因此照护不只是提供物资，也包括维持稳定关系。
  - id: E-01-07
    description: |-
      森林住所多利用树屋和架构植物；树木既提供遮蔽，也提供居住结构。
    eligibility:
      all:
        # 居住在 Saevi 部落地区即可取得该区域的基础居住知识。
        - place:
            id: saevi_region
            contact: residence
  - id: E-01-08
    description: |-
      山地住所多为洞穴或山地居所，浅地下通道也用于日常活动。
    eligibility:
      all:
        # 居住在 Myelle 部落地区即可取得该区域的基础居住知识。
        - place:
            id: myelle_region
            contact: residence
  - id: E-01-09
    description: |-
      平原以地面住宅为主，水岸材料、渡运和道路桥梁维护是常见生活内容。
    eligibility:
      all:
        # 居住在 Tovren 部落地区即可取得该区域的基础居住知识。
        - place:
            id: tovren_region
            contact: residence
  - id: E-01-10
    description: |-
      多数人长期生活在本地，来往的是有限的熟人；有些家庭几代人没有去过镇中心。
  - id: E-02
    description: |-
      生产、修理、培育、采集、运输和交换以家庭、师徒和小型作坊为单位；稀缺物资通过熟人、走货郎和镇中心集市流动。
  - id: E-02-02
    description: |-
      迷雾镇是前工业手工业社会，生产和知识传承依靠家庭、师徒和小型作坊，没有工厂式量产、现代电网、电子计算机、现代公司网络或现代金融制度。
  - id: E-02-03
    description: |-
      植物培育者培育和照护植物，采集者取得植物材料、石材或矿物，工匠加工材料并制作、修理器物和设施；不同工匠各有自己的手艺。
  - id: E-02-04
    description: |-
      运输者、渡运者和道路维护者通常通过长期生活和实际往来熟悉路线、载荷、露营、桥位、水位、天气和临时替代路线；这些基本经验可以通过观察、跟随和练习学会。走货郎沿迷雾镇内的村落道路巡回交换物资并传递消息，小商贩在铺面、摊位或交换日售卖与交换物资；中继维护者照料中继植物和通信节点。
  - id: E-02-05
    description: |-
      当地产出石材、结构矿物、山地型中继植物和上游水系材料；采石、采矿、小炉冶炼、打铁及山路维护为建筑、桥梁、工具和中继设施提供材料与手艺。
    eligibility:
      all:
        # 居住在 Myelle 部落地区即可取得该区域的基础生产知识。
        - place:
            id: myelle_region
            contact: residence
  - id: E-02-06
    description: |-
      木材、纤维、树脂、森林型中继植物、少量补充物和伴生植物种子来自森林，用于住宅、器具与中继；采集要遵守当地限制。
    eligibility:
      all:
        # 居住在 Saevi 部落地区即可取得该区域的基础生产知识。
        - place:
            id: saevi_region
            contact: residence
  - id: E-02-07
    description: |-
      平原种植低矮材料植物、水岸植物和少量补充物植物；河湖提供水、岸带材料、沉积物和水路，人们不靠种粮或捕食水生动物维持生活。
    eligibility:
      all:
        # 居住在 Tovren 部落地区即可取得该区域的基础生产知识。
        - place:
            id: tovren_region
            contact: residence
  - id: E-02-08
    description: |-
      探索前要登记进入范围、了解风险和撤离安排；途中要留下路线标记、双向核验并记录样本；归来后公开样本、记录和经验，按核验结果获得荣誉、稀缺资源或后续学习资格。地下探索可能带回稀有矿物、其他稀有材料和少量遗留物，所得由参与者、家庭或小作坊使用和交换，重要发现交长老院记录。
    eligibility:
      all:
        # 完成深层探索、返回并完成公开核验后取得整段流程知识。
        - experience:
            id: deep_exploration
            status: completed
            scope: deep_underground
  - id: E-02-09
    description: |-
      植物树脂与纤维能加工成半透明材料，用于制作器物；各家按手艺经验加工和适配，没有全域统一的做法与规格。
    eligibility:
      all:
        - vocation:
            id: craftsperson
            role: practitioner
            practice_scope: plant_resin_and_fiber_processing
  - id: E-02-10
    description: |-
      补充物植物产出少量高浓度果实或其他补充物，难以大面积培育；中继植物通常可以栽培，但成熟、传信效果好的植株与适应当地环境的种子更有价值。
    eligibility:
      all:
        - vocation:
            id: plant_cultivator
            role: practitioner
            practice_scope: supplementary_and_relay_plant_cultivation
  - id: E-02-11
    description: |-
      物品难不难取得、培育是否费心、运来是否危险、能否在当地使用、维护是否麻烦，都会影响交换价值；高浓度补充物、情绪物、伴生植物及稀有种子尤其珍贵。
  - id: E-02-12
    description: |-
      居民通常把资源按常见、区域性、稀缺和特殊来区分；稀缺补充物、情绪物、伴生植物、适配良好的中继植株和深层所得物更难取得，也更可能成为礼物、奖励或重要交换物。
  - id: E-02-13
    description: |-
      伴生植物也承载礼物、奖励、身份和关系的意义；结伴、赠送或转让仍须尊重它的意愿与照护需要。
  - id: E-02-14
    description: |-
      走货郎并不常来，行程受路程和季节限制；部落中心主要有临时交换，镇中心才有较稳定的集市。
  - id: E-03
    description: |-
      小村落处理日常协商，部落中心处理本地区事务，镇中心长老院处理跨地区、跨物种和重大公共事务。这里的地区往来都在迷雾镇内部，不是穿越适生区。
  - id: E-03-02
    description: |-
      长老主持共同体议事，按任职范围处理事务；小村落推举协调者，处理协商、互助和向上联络；地下城值守者管理入口登记、开放状态和安全事项。
  - id: E-03-03
    description: |-
      争议先在小村落协商，涉及多个村落时找地区长老，涉及跨地区资源、公共安全或共同规则时才进入镇中心长老院。
  - id: E-03-04
    description: |-
      深层地下探索约每三至五个本地年出现一次公共窗口；三个部落中心推荐参与者，镇级共同评审安全记录、资源价值和公共贡献。
  - id: E-03-05
    description: |-
      常见冲突来自资源分配、通信权限、区域进入、照护责任和观念差异；道路、桥梁、水岸或中继损坏时，相关家庭会临时协作维修。
  - id: E-03-06
    description: |-
      个人物品、住宅、工具和长期维护的种植或中继节点由个人或家庭占有和使用；道路、桥梁、公共中继、大型水源、地下入口、稀有矿脉和赴地基站由共同体管理。
  - id: E-03-07
    description: |-
      经验优势不改变资源共有规则；深入地下仍要遵守共同规则，不能把熟悉山地或地下转化为对地下资源的独占权。
  - id: E-04
    description: |-
      知识来自家庭、师徒、长老、学疗院、公共记录、走货郎和有限的通信。公共公告、私人认签和受限远距通信的权限不同，掌握中继维护和知识记录也是长老与专职守护者的重要职责。遇到不懂的事，可以向长老、医者、师傅、记录者或往来者询问；听说远方的事情不等于亲自去过。
  - id: E-04-02
    description: |-
      医者诊断和处理健康问题，教导者教学与传承，记录者记录和整理事实；他们的见闻和所学也各有范围。
  - id: E-04-03
    description: |-
      当地看病、教学和手艺传授多由家庭成员或从镇中心学成归来的人承担；种植、采集、打铁、木作、纤维、修理与中继维护主要由家庭和师徒传授。
  - id: E-04-04
    description: |-
      镇中心可以集中学习和诊疗，各部落选少量学习者前去，疑难和重伤者也尽量送到那里。
  - id: E-04-05
    description: |-
      少数长老、协调者、学成者、走货郎和探索参与者往来于村落和各个中心，消息经转述、师徒、行商与公共广播传回本地；中继没有使所有居民彼此认识或能够私人通话。
  - id: E-04-06
    description: |-
      学疗院是镇中心唯一的综合学习与诊疗机构。
    eligibility:
      all:
        - place:
            id: mistyville_center
            contact: public_area_visit
  - id: E-04-07
    description: |-
      旧档案和受限的远距通信由镇级长老或专职守护者管理，不能随意查阅或使用。
  - id: E-05
    description: |-
      连线日和静默日是共同节日；成年、结伴、迁居、伴生植物领养、交换和送别也有仪式。人们从家庭与共同生活中知道这些习俗，不必先亲自经历每一种仪式。
  - id: E-05-02
    description: |-
      连线日，人们联络亲友、交换消息、观看天空光幕；通信异常时也可能误听陌生声音，正式认签仍须双方在近处自愿完成。
  - id: E-05-03
    description: |-
      静默日，远距通信基本中断，人们更多面对面讲故事、守夜和共同生活。两节日期见 A-06。
  - id: E-05-04
    description: |-
      认签须当面完成，仪式传统因此把亲自在场视为有神圣意义的事情。
  - id: E-05-05
    description: |-
      家庭建立或更新中继植物时举行接线或迁居仪式，确认家庭节点、私人联系的边界和照护责任。
  - id: E-05-06
    description: |-
      领养有意识伴生植物时举行首次对话并作出照护承诺；成年、结伴和交换集会使用各部落常见的中继植物形态作为徽记。
  - id: E-05-07
    description: |-
      死亡时举行送别仪式，处理逝者留下的情绪物与中继联系。
  - id: E-05-08
    description: |-
      深层开门期与归返庆随探索开放和参与者归来举行，公开样本、记录和经验；地下城历史上也曾举办寻路、耐力和取物竞赛。赴地出发与归返按实际事件举行，不另设固定日期。
  - id: E-06
    description: |-
      共同历史的公共骨架是：三种智慧生命各自建立部落，后来化解地盘和水源冲突，形成迷雾镇中心；此后中继植物、深层探索、返程标记和情绪保存方法改变了共同生活。共同体记住八位英雄及其主要贡献：
  - id: E-06-02
    description: |-
      **Sera（青禾，Saevi）**聚拢森林族群，建立树屋与林地规矩，成为森林部落创建者。
  - id: E-06-03
    description: |-
      **Toro（平川，Tovren）**聚拢沿河族群，确定水岸与渡口归属，成为平原部落创建者。
  - id: E-06-04
    description: |-
      **Myra（岩聆，Myelle）**组织分散洞穴族群，确定洞穴与山路归属，成为山地部落创建者。
  - id: E-06-05
    description: |-
      **Vale（和安）**促成三个部落共同生活，被推举为第一任长老，成为迷雾镇中心缔造者。
  - id: E-06-06
    description: |-
      **Lin（枝鸣，Saevi）**发现能放大 Aethersense 的中继植物，开启远距离通信网络。
  - id: E-06-07
    description: |-
      **Durn（邃行，Myelle）**第一个深入深层地下并带出矿物样本，使地下成为可探索的资源地。
  - id: E-06-08
    description: |-
      **Reo（归途，Myelle）**发明地下返程标记与安全规矩。
  - id: E-06-09
    description: |-
      **Ning（凝华，Saevi）**发明保存凝练情绪的方法，改变情绪物的交换和表达。
  - id: E-06-10
    description: |-
      以上人物的完整生平、事件先后、具体年代和未写入公共骨架的细节，不是每个居民都能完整复述；流传版本也可能有差异。精确年代没有可靠记录，不能从故事中推算确定年份。
    mastery_difficulty: medium
  - id: E-07
    description: |-
      云冠城和深层地下引出许多说法；有人相信，也有人怀疑。看见景观或听到故事，不能说明已经知道它的起源和内部情况。
  - id: E-07-02
    description: |-
      共同体重视连结、扎根与远行、三域共生、尊重边界与未知，以及赴地后的保持联系和归返；与伙伴建立联系不意味着占有对方。
  - id: E-07-03
    description: |-
      当地传统重视森林生命延续、关系维护和伴生照护。
    eligibility:
      all:
        # 居住在 Saevi 部落地区即可取得该区域的基础传统知识。
        - place:
            id: saevi_region
            contact: residence
  - id: E-07-04
    description: |-
      当地传统重视水路、互助与归返。
    eligibility:
      all:
        # 居住在 Tovren 部落地区即可取得该区域的基础传统知识。
        - place:
            id: tovren_region
            contact: residence
  - id: E-07-05
    description: |-
      当地传统重视深层聆听、记录与谨慎进入。
    eligibility:
      all:
        # 居住在 Myelle 部落地区即可取得该区域的基础传统知识。
        - place:
            id: myelle_region
            contact: residence
  - id: E-07-06
    description: |-
      森林当地居民把祖树视为现存森林树系的共同祖源，这是地方信念。
    eligibility:
      all:
        # 需要接触当地传统；看到祖树本身不自动取得这条信念知识。
        - place:
            id: firstroot_tree
            contact: local_tradition
  - id: E-07-07
    description: |-
      三种物种流传着来自共同远古陆地祖先、后来在不同地方形成三种族群的说法，居民无法亲自验证远古经过。
  - id: E-07-08
    description: |-
      有人说云冠城是先民档案所，有人说是避难所，也有人说是未完成的旧城或未来重新连线的高地；这些解释彼此不同，都未被证实。
  - id: E-07-09
    description: |-
      地下流传着“世界根系”“记忆库”和试炼之路的故事；它们不能证明地下的真实结构。
  - id: E-07-10
    description: |-
      云冠城由谁建造、用来做什么、里面是什么样、为何悬浮，以及是否存在特殊进入方式，都没有可靠的公共答案。
  - id: E-08
    description: |-
      迷雾镇与地球有有限且不稳定的联系；少数居民可以自愿参加赴地计划，与地球家庭相互选择，也有权拒绝，大家并不普遍迁往地球。赴地需要报名、同意和专门安排；对多数参加者来说，参加赴地计划通常是他们第一次前往镇中心。赴地事务员办理联络、出发、归返、安全和地球家庭交接。
  - id: E-08-02
    description: |-
      赴地和归返依靠专门安排的设施，通道能力有限且不稳定；传送由地球侧设施完成。抵达后，精灵的初始化基础知识包括：自己已经在地球生活，当前所在的 ElfieNest 是自己的生活基地和家，这里有接收抵达的传送阵、自己的房间、生活活动空间以及与地球家庭联系的地方。
    eligibility:
      all:
        - experience:
            id: earth_arrival
            status: completed
            outcome: arrived_on_earth
  - id: E-08-03
    description: |-
      这些是抵达后的基础事实，不等于已经熟悉地球社会、周围环境或当天的巢内状态；后者需要通过实际生活和观察逐步获得。有意识伴生植物不能脱离赖以生存的环境一同赴地。
    eligibility:
      all:
        - experience:
            id: earth_arrival
            status: completed
            outcome: arrived_on_earth
  - id: E-08-04
    description: |-
      公共记录认为，最初是地球侧收到来自 Elfaria 的异常信号；稳定通道和地球侧传送设施由地球技术建设，Elfaria 还不能独立建造这样的传送设施。
