rules:
  social_graph:
    public_contact_count_distribution: {0: 0.50, 1: 0.30, 2: 0.15, 3: 0.05}
    cohort_count_distribution: {0: 0.25, 1: 0.50, 2: 0.25}
    public_contact_reuse_probability: 0.35
  world:
    id: elfaria-world-space.v3
    source_refs:
    - world#8.4
    - world#8.6
    route_time_model_ref: geography-model.v9
    route_topology_source: knowledge/geography.yaml
    place_registry_ref: knowledge/geography.yaml#places
    route_aliases_ref: knowledge/geography.yaml#route_aliases
    route_time_policy: resolve_from_geography_grid_hops
    routing:
      method: shortest_legal_path_over_geography_grid_hops
      allow_straight_line_substitution: false
      allow_map_pixel_measurement: false
      time_policy: land_grid_hop_days_or_water_grid_hop_days
      require_edge_permissions_at_event: true
    known_limits:
    - 渡点不是湖心岛
    - 天镜湖山路口不是整处湖泊景观
    - 缺少住宅连接段和分段通行数据时不生成完整到访证据
    route_geometry_status: endpoints_and_grid_hop_rules_only
    access_rules:
    - id: earthbound_entry
      place_ref: earthbound_station
      requires:
      - scheduled_transition_or_authorized_visit
      - valid_entry_permission
      outside_visibility_grants_entry: false
    - id: island_entry
      place_ref: lakeheart_isle
      requires:
      - registered_water_route
      - actual_crossing
      landing_is_island: true
    - id: cloudcrown_entry
      place_ref: cloudcrown_city
      ordinary_travel_allowed: false
      observation_only: true
    calendar:
      source_ref: world#3
      days_per_local_year: 196
      annual_events:
      - event_ref: connection_day
        day: 50
      - event_ref: silence_day
        day: 148
      earth_age_conversion: false
  population:
    id: population-model.v4
    source_refs:
    - generation#1
    - world#8.6
    selection_order:
    - user_selected_species
    - uniform_allowed_region
    - uniform_cell_within_selected_region
    allowed_species_by_region_ref: knowledge/geography.yaml#regions[].allowed_species
    species_selection:
      source: user_input
      allowlist_is_hard_constraint: true
      allowed_regions_from: regions[].allowed_species
    region_sampling:
      distribution: uniform_over_allowed_regions_for_selected_species
      derive_regions_from: knowledge/geography.yaml#regions[].allowed_species
    cell_sampling:
      distribution: uniform_over_cells_in_selected_region
      derive_cells_from: knowledge/geography.yaml#grid.region_matrix
    allocation_rule: selected_species_uniform_region_then_uniform_cell
    allocation_status:
      status: grid_hop_time_ready
      model_member: knowledge/geography.yaml
      sample_unit_count: 100
      birth_eligible_cell_count: 83
      region_distribution: uniform_over_allowed_regions_for_selected_species
      cell_distribution: uniform_over_cells_in_selected_region
      birth_eligible_regions_have_allowed_species: true
      ordinary_cell_pair_topology_computable: true
      ordinary_grid_edge_travel_times_resolved: true
    grid_model_member: knowledge/geography.yaml
    grid_dimensions:
    - 10
    - 10
    sample_unit_count: 100
    distance_model: legal_path_grid_hops
  household:
    id: household-care.v1
    source_ref: generation#2
    fixed_relative_count: false
    require_parent_alive_at_adoption: false
    required_evidence:
    - age_at_event
    - alive_at_event
    - care_capacity
    - shared_residence_or_contact
    childhood_care:
    - actual_caregiver
    residence_templates:
    - id: forest_tree_dwelling
      region_refs:
      - east_forest
      source_ref: world#8.3
      instance_scope: current_genesis
      requires:
      - approved_habitable_cell
      - settlement_ref
      - registered_road_connector
      - residents_at_event
      public_place_creation: false
    - id: plain_ground_dwelling
      region_refs:
      - south_plain
      - lake_shore
      source_ref: world#8.3
      instance_scope: current_genesis
      requires:
      - approved_habitable_cell
      - settlement_ref
      - registered_road_connector
      - residents_at_event
      public_place_creation: false
    - id: mountain_dwelling
      region_refs:
      - north_mountain
      source_ref: world#8.3
      instance_scope: current_genesis
      requires:
      - approved_habitable_cell
      - settlement_ref
      - registered_road_connector
      - residents_at_event
      public_place_creation: false
    - id: shallow_cave_dwelling
      region_refs:
      - shallow_underground
      - north_mountain
      source_ref: world#8.3
      instance_scope: current_genesis
      requires:
      - approved_habitable_cell
      - settlement_ref
      - registered_road_connector
      - residents_at_event
      public_place_creation: false
    - id: town_dwelling
      place_refs:
      - mistyville_center
      source_ref: world#8.2
      instance_scope: current_genesis
      requires:
      - approved_habitable_cell
      - settlement_ref
      - registered_road_connector
      - residents_at_event
      public_place_creation: false
  life_archetypes:
    id: life-archetypes.v1
    source_ref: generation#8
    status: confirmed
    selection:
      weight_field: weight
      normalize_within_eligible_species_stage_and_region: true
      vocation_is_potential_until_qualified: true
      childhood_without_qualification_uses: household_learning
    non_occupational_paths:
    - id: household_learning
      applicable_stages: [childhood]
      requires:
      - actual_care_relationship
      - age_appropriate_activity
      - actual_contact
      vocation_assignment: forbidden_before_qualification
    archetypes:
    - id: household_member
      applicable_species: [Saevi, Tovren, Myelle]
      applicable_stages: [childhood, adolescent, mature, elder]
      region_selection: geography_allowed_regions_for_species
      place_selection: registered_residence_in_selected_region
      weight: 1.0
      household_roles: [caregiver, household_member, learner]
      care_and_trade_context: 在实际居住区域参与家庭照护、邻里互助和当地生产生活。
      learning_path_ref: household_learning
      apprenticeship_refs: [apprenticeship]
      vocation_options_ref: rules.learning.vocations
      vocation_selection: actual_apprenticeship_only
      vocation_ref: null
      proficiency_band: introductory
      workplace_place_selection: actual_household_or_apprenticeship_place
      residence_rule_ref: rules.household.residence_templates
  names:
    id: name-rules.v1
