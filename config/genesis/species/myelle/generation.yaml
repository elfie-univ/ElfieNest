  requires: [habitable_place, species_suitable_environment, registered_residence,
    feasible_family_and_care, feasible_life_and_earth_transition]
  region_allowlist_is_hard_constraint: true
  biological_parent_age_gap_ref: rules.household.biological_parent_min_age_gap_local_years
