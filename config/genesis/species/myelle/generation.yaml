    allowed_stages: all_defined_stages
    excluded_stages: []
    age_restriction: strictly_greater_than_one_local_year
    minimum_age_rule_ref: rules.candidates.minimum_age_local_years_exclusive
    source_ref: species#genesis-birth-and-arrival
  requires: [alive_at_departure, alive_at_arrival, age_appropriate_understanding,
    voluntary_consent, feasible_legal_journey, completed_age_appropriate_preparation,
    age_strictly_greater_than_one_local_year]
  adult_care: 按个体实际能力与需要检查，不因成年或物种名称免除必要照护。
  consent_by_caregiver_replaces_individual_willingness: false
  preparation_rule_ref: rules.arrival
  training_does_not_prove_arrival: true
  actual_arrival_requires: actual_arrival_fact
  runtime_asset_gate_ref: appearance.yaml#runtime_capabilities
  missing_evidence: reject_plan
appearance_constraints:
  rule_ref: appearance.yaml
  same_actual_age_as_identity: true
  unavailable_control: reject_request
  preferences_override_support_or_hard_choices: false
  preferences_assign_personality_profession_or_knowledge: false
  life_stage_visual_curve:
    status: author_review_required
    reason: 生命周期已有范围，但逐年龄外貌曲线和各阶段视觉验收未提供；不能用年龄标签冒充验证。
