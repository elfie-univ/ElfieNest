- id: deep_exploration_recent_windows
  label_zh: 近年深层地下探索
  label_en: Recent Deep Underground Exploration Windows
  kind: public_expedition_with_explicit_instances
  impact_scope: mistyville_territory
  schedule:
    recurrence: explicit_instances
    reference: current_local_year
    instances:
    - id: deep_exploration_one_year_ago
      years_ago: 1
      day_of_year: 36
      activities:
      - permitted_deep_entry
      - sample_recovery
      - route_and_safety_recording
      public_effects:
      - verified_samples_and_a_route_report_are_published_after_return
      - a_return_gathering_records_participants_and_results
    - id: deep_exploration_three_years_ago
      years_ago: 3
      day_of_year: 104
      activities:
      - permitted_deep_entry
      - magnetic_anomaly_survey
      - route_marker_update
      public_effects:
      - the_verified_route_record_is_updated_after_return
      - the_public_report_can_support_later_training_or_exploration_review
    - id: deep_exploration_five_years_ago
      years_ago: 5
      day_of_year: 164
      activities:
      - permitted_deep_entry
      - rare_material_or_relic_recovery
      - public_return_report
      public_effects:
      - recovered_materials_or_relics_are_registered_and_reviewed
      - verified_contribution_can_receive_public_recognition
  locations:
    mode: controlled_route
    place_refs:
    - undercity_gate
    - deep_underground
  participant_policy:
    participation_probability: 0.5
    duration_days: 1
    minimum_age_years: 2
    required_qualification: jointly_approved_explorer
    eligible: recommended_and_jointly_approved_explorers
    selection: tribal_recommendation_joint_review_and_permitted_route
    creates_contact_opportunity: true
  common_activities:
  - pre_entry_registration
  - safety_briefing
  - permitted_exploration
  - return_and_verification
  common_public_effects:
  - exploration_is_not_created_without_a_specific_open_window_and_legal_route
  - the_return_report_is_the_public_source_for_samples_records_and_recognition
  source_refs:
  - world#7.6
  - generation#8
