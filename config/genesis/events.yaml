document_kind: public_event_catalog
schema_version: 1
status: published

# 这份文件只描述共享世界中会对居民公开、并可成为共同经历来源的事件。
# 家庭、学习、工作、邻里、旅游等个人关系方向不在这里配置。
scope:
  public_only: true
  excluded:
  - family_relationships
  - learning_and_work
  - neighborhood_relationships
  - travel_purposes
  - individual_life_events

calendar:
  id: elfaria_local
  days_per_year: 196
  day_index: 1_based
  # 尚无来源可确定当前本地年与日，不从地球日期推算。
  current_local_year: null
  current_day_of_year: null

events:
- id: connection_day
  label_zh: 连线日
  label_en: Connection Day
  kind: recurring_public_event
  impact_scope: mistyville_territory
  schedule:
    recurrence: annual
    day_of_year: 50
  locations:
    mode: parallel_registered_public_centers
    place_refs:
    - skyreach_square
    - saevi_tribal_center
    - tovren_tribal_center
    - myelle_tribal_center
  activities:
  - public_gathering
  - public_message_exchange
  - remote_contact_attempts
  - sky_light_observation
  public_effects:
  - public_communication_is_more_active_near_the_magnetic_peak
  - residents_can_exchange_news_and_meet_people_from_other_communities
  - participation_does_not_create_a_relationship_without_actual_contact
  participant_policy:
    participation_probability: 0.5
    duration_days: 1
    minimum_age_years: 2
    eligible: alive_and_present_residents
    selection: reachability_and_local_interest
    creates_contact_opportunity: true
  source_refs:
  - world#3.1.1
  - world#7.6

