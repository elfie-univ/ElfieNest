version: 1
core_revision: memory.ontology.v1

type_groups:
  - id: social_relations
    label: 社会关系
    color: "#ff8f6b"
    order: 1
  - id: entities
    label: 实体
    color: "#7db277"
    order: 2
  - id: space_geography
    label: 空间地理
    color: "#5bb9ff"
    order: 3
  - id: events
    label: 事件
    color: "#ffc857"
    order: 4
  - id: general_knowledge
    label: 通用知识
    color: "#42d6a4"
    order: 5

node_types:
  - { id: elfie, label: 精灵, group: social_relations, color: "#ff8f6b" }
  - { id: person, label: 人物, group: social_relations, color: "#b892ff" }
  - { id: group, label: 群体/家庭, group: social_relations, color: "#d5a85f" }
  - { id: organism, label: 生物, group: entities, color: "#7db277" }
  - { id: object, label: 物体, group: entities, color: "#7db277" }
  - { id: material, label: 材料, group: entities, color: "#91bd8b" }
  - { id: cosmic_entity, label: 天体/宇宙实体, group: space_geography, color: "#5bb9ff" }
  - { id: place, label: 地点, group: space_geography, color: "#5bb9ff" }
  - { id: event, label: 事件, group: events, color: "#ffc857" }
  - { id: concept, label: 概念, group: general_knowledge, color: "#42d6a4" }
  - { id: claim, label: 命题, group: general_knowledge, color: "#42d6a4" }
  - { id: theory_or_model, label: 理论/模型, group: general_knowledge, color: "#37bf94" }
  - { id: principle_or_law, label: 原理/定律, group: general_knowledge, color: "#37bf94" }
  - { id: pattern, label: 模式, group: general_knowledge, color: "#37bf94" }
  - { id: rule_or_guideline, label: 规则/指南, group: general_knowledge, color: "#37bf94" }
  - { id: method_or_procedure, label: 方法/流程, group: general_knowledge, color: "#37bf94" }
  - { id: viewpoint, label: 观点, group: general_knowledge, color: "#37bf94" }

episode_types:
  - { id: conversation, label: 聊天讨论 }
  - { id: activity, label: 活动 }
  - { id: outing, label: 外出游玩 }
  - { id: learning, label: 学习成长 }
  - { id: life_event, label: 生活经历 }
  - { id: observation, label: 观察 }
  - { id: reflection, label: 反思 }
  - { id: unclassified, label: 未分类 }

common_qualifiers: &common_qualifiers
  - context
  - viewpoint
  - valid_from
  - valid_to
  - object_unit
  - object_literal_type
  - polarity
  - epistemic_status
  - confidence
  - importance

predicate_aliases:
  causal: causes
  cause: causes
  family: kin_of
  kin: kin_of
  friend: friend_of
  acquaintance: acquaintance_of
  owner: owned_by
  like: likes
  dislike: dislikes
  favorite: prefers
  involved_in: involves

