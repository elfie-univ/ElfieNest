version: 1
system:
  adoption:
    max_elfies_per_user: 3
    personality_presets_enabled:
      活泼好动: true
      安静温顺: true
      好奇探索: true
      胆小害羞: true
      傲娇独立: true
      完全随机: true
  engine:
    tick_interval_sec: 1.5
  security:
    session_ttl_days: 7
    rate_limit:
      max_attempts: 5
      window_seconds: 300
  model_execution:
    ollama_host: http://localhost:11434
    energy_threshold_fast: 30.0
    complexity_threshold_deep: 3
    temperature: 0.7
    max_tokens: 1500
