version: 2
food_generation_preferences:
  # Lower priority wins after exact model evidence is fresh.  Tier 2 is the
  # minimum quality tier for normal automatic Food generation; local Ollama
  # remains eligible for Emergency Food even when its tier is lower.
  - catalog_id: ollama
    model_id: qwen2.5:0.5b
    priority: 20
    quality_tier: 1
  - catalog_id: openai_api
    model_id: gpt-4o-mini
    priority: 30
    quality_tier: 2
  - catalog_id: deepseek_api
    model_id: deepseek-v4-flash
    priority: 20
    quality_tier: 2
  - catalog_id: volcengine_coding_plan
    model_id: deepseek-v4-flash
    priority: 10
    quality_tier: 2
