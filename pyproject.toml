[project]
name = "elfienest"
version = "0.1.0"
description = "ElfieNest - Embodied AI creature simulation with three-layer brain architecture"
requires-python = ">=3.9,<3.10"
authors = [
    {name = "ElfieNest Team"},
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["elfie*", "elfienest*", "runtime*"]

[tool.ruff]
line-length = 88
target-version = "py39"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "UP006",  # Use `dict` instead of `Dict` - keep for Python 3.9 compatibility
    "UP007",  # Use `X | None` instead of `Optional[X]` - keep for Python 3.9 compatibility
    "UP035",  # `typing.Dict` is deprecated - keep for Python 3.9 compatibility
    "UP045",  # Use `X | None` for type annotations - keep for Python 3.9 compatibility
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["elfie", "elfienest", "runtime"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
disallow_incomplete_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "elfie.*.legacy.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["elfie", "elfienest", "runtime"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 55
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
