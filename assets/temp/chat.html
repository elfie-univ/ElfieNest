<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElfieNest - 艾菲聊天</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-input: #16162a;
            --bg-bubble-user: #4a6cf7;
            --bg-bubble-elfie: #2d2d44;
            --text-primary: #e8e8f0;
            --text-secondary: #9898b0;
            --text-bubble-user: #ffffff;
            --text-bubble-elfie: #e0e0f0;
            --border-subtle: #2a2a40;
            --accent: #6c7cf7;
            --accent-hover: #5a6ae0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c7cf7, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .header-info .status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-dot.connected { background: #4ade80; }
        .status-dot.connecting { background: #fbbf24; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Messages ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.elfie { align-self: flex-start; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg.elfie .msg-avatar {
            background: linear-gradient(135deg, #6c7cf7, #a78bfa);
        }

        .msg.user .msg-avatar {
            background: #3a3a55;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            line-height: 1.55;
            font-size: 14px;
            word-break: break-word;
        }

        .msg.elfie .msg-bubble {
            background: var(--bg-bubble-elfie);
            color: var(--text-bubble-elfie);
            border-bottom-left-radius: 4px;
        }

        .msg.user .msg-bubble {
            background: var(--bg-bubble-user);
            color: var(--text-bubble-user);
            border-bottom-right-radius: 4px;
        }

        /* ── Typing indicator ── */
        .typing {
            display: none;
            align-self: flex-start;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.25s ease-out;
        }

        .typing.visible { display: flex; }

        .typing .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c7cf7, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .typing-dots {
            background: var(--bg-bubble-elfie);
            padding: 10px 16px;
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ── Input bar ── */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .input-bar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-bar input::placeholder { color: var(--text-secondary); }
        .input-bar input:focus { border-color: var(--accent); }

        .input-bar button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .input-bar button:hover { background: var(--accent-hover); }
        .input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── System message ── */
        .system-msg {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 6px 0;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .msg { max-width: 92%; }
            .msg-avatar { width: 28px; height: 28px; font-size: 13px; }
            .msg-bubble { font-size: 13px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="avatar">🦊</div>
        <div class="header-info">
            <h1>艾菲</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">正在连接...</span>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="system-msg">ElfieNest 仿生生命体 · 浏览器聊天界面</div>
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typingIndicator">
        <div class="msg-avatar">🦊</div>
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="输入消息跟艾菲聊天..." autocomplete="off" />
        <button id="sendBtn" disabled>发送</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const typingEl = document.getElementById('typingIndicator');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let ws = null;
        let connected = false;

        function setStatus(state) {
            statusDot.className = 'status-dot';
            if (state === 'connected') {
                statusDot.classList.add('connected');
                statusText.textContent = '已连接';
                connected = true;
                sendBtn.disabled = false;
            } else if (state === 'connecting') {
                statusDot.classList.add('connecting');
                statusText.textContent = '正在连接...';
                connected = false;
                sendBtn.disabled = true;
            } else {
                statusText.textContent = '已断开 — 正在重连...';
                connected = false;
                sendBtn.disabled = true;
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = role === 'elfie' ? '🦊' : '👤';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            div.appendChild(avatar);
            div.appendChild(bubble);
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function showTyping(show) {
            typingEl.classList.toggle('visible', show);
            if (show) scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !connected) return;

            addMessage('user', text);
            ws.send(JSON.stringify({
                event: 'user_message',
                payload: { elfie_id: '艾菲', message: text }
            }));
            inputEl.value = '';
            showTyping(true);
        }

        function connect() {
            setStatus('connecting');
            ws = new WebSocket('ws://127.0.0.1:8765');

            ws.onopen = () => {
                setStatus('connected');
                // Register scene so the engine knows we're here
                ws.send(JSON.stringify({
                    event: 'register_scene',
                    payload: { furniture: ['bed_1', 'chair_1'] }
                }));
                addSystemMsg('已连接到 ElfieNest 服务');
            };

            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch { return; }

                const action = data.action;
                const payload = data.payload || {};

                if (action === 'speak_event' && payload.elfie_id === '艾菲') {
                    showTyping(false);
                    addMessage('elfie', payload.text || '');
                }
                // Ignore other events (physical_impact_event, go_to, emotion_expression, etc.)
            };

            ws.onclose = () => {
                setStatus('disconnected');
                showTyping(false);
                addSystemMsg('连接已断开，3 秒后重连...');
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                // onclose will fire after this
            };
        }

        // Input handling
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);

        // Start
        connect();
    </script>
</body>
</html>
