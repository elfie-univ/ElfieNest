  <path class="red" d="M1030 526 L1030 665"/><path class="red" d="M1030 745 L1030 894"/>
  <line class="legend" x1="58" y1="1100" x2="104" y2="1100"/><text class="muted" x="116" y="1105">black: cross-module data / protocol flow</text>
  <line class="legend-red" x1="522" y1="1100" x2="568" y2="1100"/><text class="muted" x="580" y="1105">red: concrete internal control flow</text>
</svg>
