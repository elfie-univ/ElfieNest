  <path class="black" d="M1153 986 L1138 986"/>
  <path class="red" d="M420 296 C400 348 250 392 220 466"/><path class="red" d="M505 296 C650 352 940 394 1010 464"/><path class="red" d="M388 495 L367 495"/>
