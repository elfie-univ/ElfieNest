appId: com.elfienest.desktop
productName: ElfieNest
artifactName: ElfieNest-${version}-${os}-${arch}.${ext}
asar: true
directories:
  buildResources: .
extraMetadata:
  main: bootstrap/desktop_host.mjs
files:
  - desktop-interface/**/*
  - "!desktop-interface/macos/**/*"
  - bootstrap/desktop_host.mjs
  - infrastructure/godot/lifecycle/electron/**/*
  - assets/elfienest-tray-icon.png
  - package.json
extraResources:
  - from: packaged-resources
    to: .
mac:
  extraResources:
    - from: desktop-interface/macos
      to: wifi-access-helper
  icon: assets/elfienest-macos-app-icon.png
  extendInfo:
    NSLocationUsageDescription: ElfieNest 需要读取当前 Wi-Fi 名称，用于在手机扫码连接时提供网络提示；不会记录你的位置信息。
    NSLocationWhenInUseUsageDescription: ElfieNest 需要读取当前 Wi-Fi 名称，用于在手机扫码连接时提供网络提示；不会记录你的位置信息。
  target: [pkg]
pkg:
  installLocation: /Applications
  mustClose: [com.elfienest.desktop]
  scripts: packaging/macos
win:
  icon: assets/elfienest-app-icon.png
  target: [nsis]
nsis:
  include: packaging/windows/installer.nsh
  oneClick: false
linux:
  # Supply the freedesktop sizes explicitly.  GNOME's application grid may
  # fall back to its generic gear when a package contains only the 1024px
  # source icon; electron-builder accepts a dimension-named PNG directory and
  # installs each size into hicolor.
  icon: assets/linux-icons
  executableName: elfienest-gui
  target: [deb]
deb:
  afterInstall: packaging/linux/after-install.sh
  afterRemove: packaging/linux/after-remove.sh
