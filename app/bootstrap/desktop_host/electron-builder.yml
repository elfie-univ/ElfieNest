appId: com.elfienest.desktop
productName: ElfieNest
artifactName: ElfieNest-${version}-internal-${os}-${arch}.${ext}
asar: true
extraMetadata:
  main: bootstrap/desktop_host.mjs
files:
  - from: ../../../build/components/desktop-interface
    to: desktop-interface
    filter: ["**/*"]
  - from: ../../../app/bootstrap/desktop_host/host_main.mjs
    to: bootstrap/desktop_host.mjs
  - from: ../../../infrastructure/godot/lifecycle/electron
    to: infrastructure/godot/lifecycle/electron
    filter: ["**/*"]
  - package.json
extraResources:
  - from: ../../../build/staging/${env.ELFIENEST_TARGET}/resources
    to: .
mac:
  icon: assets/elfienest.png
  target: [dmg]
win:
  icon: assets/elfienest.png
  target: [nsis]
linux:
  icon: assets/elfienest.png
  target: [AppImage]
directories:
  output: ../../../dist
