appId: com.elfienest.desktop
productName: ElfieNest
artifactName: ElfieNest-${version}-${os}-${arch}.${ext}
asar: true
directories:
  buildResources: .
extraMetadata:
  main: bootstrap/desktop_host.mjs
files:
  - desktop-interface/**/*
  - bootstrap/desktop_host.mjs
  - infrastructure/godot/lifecycle/electron/**/*
  - assets/elfienest-tray-icon.png
  - package.json
extraResources:
  - from: packaged-resources
    to: .
mac:
  icon: assets/elfienest-macos-app-icon.png
  target: [pkg]
pkg:
  installLocation: /Applications
  mustClose: [com.elfienest.desktop]
  scripts: packaging/macos
win:
  icon: assets/elfienest-app-icon.png
  target: [nsis]
nsis:
  include: packaging/windows/installer.nsh
  oneClick: false
linux:
  icon: assets/elfienest-app-icon.png
  executableName: elfienest-gui
  target: [deb]
deb:
  afterInstall: packaging/linux/after-install.sh
  afterRemove: packaging/linux/after-remove.sh
