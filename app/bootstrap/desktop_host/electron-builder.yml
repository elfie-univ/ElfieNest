appId: com.elfienest.desktop
productName: ElfieNest
artifactName: ElfieNest-${version}-internal-${os}-${arch}.${ext}
asar: true
extraMetadata:
  main: bootstrap/desktop_host.mjs
files:
  - desktop-interface/**/*
  - bootstrap/desktop_host.mjs
  - infrastructure/godot/lifecycle/electron/**/*
  - assets/elfienest-tray-icon.png
  - package.json
extraResources:
  - from: packaged-resources
    to: .
mac:
  icon: assets/elfienest-macos-app-icon.png
  target: [dmg]
win:
  icon: assets/elfienest-app-icon.png
  target: [nsis]
linux:
  icon: assets/elfienest-app-icon.png
  target: [AppImage]
