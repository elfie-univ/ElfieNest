<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElfieNest - 登录</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-input: #16162a;
            --text-primary: #e8e8f0;
            --text-secondary: #9898b0;
            --border-subtle: #2a2a40;
            --accent: #6c7cf7;
            --accent-hover: #5a6ae0;
            --error: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .login-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .login-btn:hover {
            background: var(--accent-hover);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--error);
            margin-bottom: 16px;
            text-align: center;
        }

        .error-msg.visible {
            display: block;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-bottom: 16px;
        }

        .loading-spinner.visible {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-subtle);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auto-redirecting {
            text-align: center;
            padding: 40px 20px;
        }

        .auto-redirecting .spinner {
            width: 32px;
            height: 32px;
            border-width: 3px;
            margin-bottom: 16px;
        }

        .auto-redirecting p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .setup-redirect {
            text-align: center;
            padding: 40px 20px;
        }

        .setup-redirect .spinner {
            width: 32px;
            height: 32px;
            border-width: 3px;
            margin-bottom: 16px;
        }

        .setup-redirect p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 60px;
            }

            .login-card {
                padding: 28px 20px;
            }

            .logo-icon {
                font-size: 40px;
            }

            .logo h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <div class="logo">
            <span class="logo-icon">🦊</span>
            <h1>ElfieNest</h1>
            <p>仿生生命体管理平台</p>
        </div>

        <div class="loading-spinner" id="checkSessionSpinner">
            <div class="spinner"></div>
        </div>

        <div class="auto-redirecting" id="autoRedirectMsg" style="display:none;">
            <div class="spinner"></div>
            <p>已登录，正在跳转...</p>
        </div>

        <div class="setup-redirect" id="setupRedirectMsg" style="display:none;">
            <div class="spinner"></div>
            <p>需要创建管理员账号，正在跳转...</p>
        </div>

        <div class="error-msg" id="errorMsg">用户名或密码错误</div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required />
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>
    </div>

    <script>
        (function () {
            const loginCard = document.getElementById('loginCard');
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const checkSessionSpinner = document.getElementById('checkSessionSpinner');
            const autoRedirectMsg = document.getElementById('autoRedirectMsg');
            const setupRedirectMsg = document.getElementById('setupRedirectMsg');

            function showError(msg) {
                errorMsg.textContent = msg || '用户名或密码错误';
                errorMsg.classList.add('visible');
            }

            function hideError() {
                errorMsg.classList.remove('visible');
            }

            function setLoading(loading) {
                loginBtn.disabled = loading;
                loginBtn.textContent = loading ? '登录中...' : '登 录';
            }

            function redirectByRole(role) {
                if (role === 'admin') {
                    window.location.href = '/static/admin.html';
                } else {
                    window.location.href = '/static/user.html';
                }
            }

            // Check if setup is needed first, then check session
            async function checkSession() {
                checkSessionSpinner.classList.add('visible');

                // First: check if setup wizard is needed (no users exist)
                try {
                    var setupResp = await fetch('/api/auth/setup-status', { credentials: 'include' });
                    if (setupResp.ok) {
                        var setupData = await setupResp.json();
                        if (setupData.need_setup) {
                            // No users yet — redirect to setup wizard
                            checkSessionSpinner.classList.remove('visible');
                            loginCard.style.display = 'none';
                            setupRedirectMsg.style.display = 'block';
                            window.location.href = '/static/setup.html';
                            return;
                        }
                    }
                } catch (e) {
                    // Network error checking setup status — continue to session check
                }

                // Then: check if already logged in
                try {
                    const resp = await fetch('/api/auth/me', {
                        credentials: 'include'
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        // 存储 CSRF token（已有 session 时后端也会返回）
                        if (data.csrf_token) {
                            localStorage.setItem('csrf_token', data.csrf_token);
                        }
                        checkSessionSpinner.classList.remove('visible');
                        // Already logged in, redirect
                        loginCard.style.display = 'none';
                        autoRedirectMsg.style.display = 'block';
                        redirectByRole(data.role);
                        return;
                    }
                } catch (e) {
                    // Network error, just show login form
                }
                checkSessionSpinner.classList.remove('visible');
                loginCard.style.display = 'block';
            }

            // Start session check immediately
            loginCard.style.display = 'none';
            checkSession();

            // Form submission
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideError();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError('请输入用户名和密码');
                    return;
                }

                setLoading(true);

                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: new URLSearchParams({
                            username: username,
                            password: password
                        }),
                        credentials: 'include'
                    });

                    if (resp.ok) {
                        const data = await resp.json();
                        // 存储 CSRF token 和 session token 到 localStorage
                        if (data.csrf_token) {
                            localStorage.setItem('csrf_token', data.csrf_token);
                        }
                        if (data.session_token) {
                            localStorage.setItem('session_token', data.session_token);
                        }
                        const role = data.user && data.user.role;
                        if (role) {
                            redirectByRole(role);
                        } else {
                            // Fallback: no role in response
                            window.location.href = '/static/admin.html';
                        }
                    } else if (resp.status === 401) {
                        showError('用户名或密码错误');
                    } else if (resp.status === 429) {
                        showError('登录尝试过于频繁，请稍后再试');
                    } else {
                        showError('登录失败，请重试');
                    }
                } catch (e) {
                    showError('无法连接到服务，请检查网络');
                } finally {
                    setLoading(false);
                }
            });

            // Enter key triggers login (native form behavior, but ensure it works)
            passwordInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        })();
    </script>
</body>
</html>
